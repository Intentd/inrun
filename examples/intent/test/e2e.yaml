# yaml-language-server: $schema=https://inrun.dev/schema/v1/e2e.json
apiVersion: inrun.dev/v1
kind: E2E
metadata:
  name: website-intent-e2e
  description: >
    Send intent.json to the in-cluster gateway, check the CR it creates is
    reconciled by the Python reconciler, and read the view back through the
    gateway. The reconciler runs as a Deployment, applied in setup.

spec:
  blueprint: ../blueprint.yaml
  crd: ../manifests/crd.yaml
  valuesFiles:
    - ./e2e-values.yaml

  cluster:
    provider: kind
    name: inrun-e2e
    reuse: false

  setup:
    apply:
      - path: ../manifests/secret.yaml
      - path: ../reconciler/deploy.yaml
        wait:
          - kind: Deployment
            name: website-reconciler
            namespace: default
            ready: true
            timeout: 90s

  expect:
    - include: ./include/intent.yaml
    - include: ./include/delete.yaml

  onFailure:
    kubectl:
      get:
        - kind: Website
          namespace: default
      logs:
        - labelSelector: app.kubernetes.io/component=gateway
          namespace: inrun-system
          since: 5m
        - labelSelector: app=website-reconciler
          namespace: default
          since: 5m
    commands:
      - run: kubectl get events -n default --sort-by=.lastTimestamp
