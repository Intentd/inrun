apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webservices.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: WebService
    plural: webservices
    singular: webservice
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: Container image
                port:
                  type: integer
                  description: Port the container listens on (default 8080)
                replicas:
                  type: integer
                  description: Replicas to start with (default 2; the autoscaler goes up to 4)
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
