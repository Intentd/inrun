apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appconfigs.demo.inrun.dev
spec:
  group: demo.inrun.dev
  names:
    kind: AppConfig
    plural: appconfigs
    singular: appconfig
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                scaling:
                  type: object
                  properties:
                    min:
                      type: integer
                      minimum: 1
                observability:
                  type: object
                  properties:
                    logging:
                      type: object
                      properties:
                        level:
                          type: string
                          enum: ["debug", "info", "warn", "error"]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: MinReplicas
          type: integer
          jsonPath: .spec.scaling.min
        - name: LogLevel
          type: string
          jsonPath: .spec.observability.logging.level
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
