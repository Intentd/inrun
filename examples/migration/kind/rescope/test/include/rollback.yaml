# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
# Rollback: restore every namespaced source (team-c's under its new name)
expect:
  - name: Rollback dry-run reports the four snapshotted destinations
    timeout: 30s
    commands:
      - run: inrun migrate rollback -f ../../blueprint.yaml --dry-run -ojson
        json:
          - path: .totals.crs
            equals: 4
          - path: .totals.migrated
            equals: 4

  - name: Rollback restores all four namespaced sources
    timeout: 60s
    commands:
      - run: inrun migrate rollback -f ../../blueprint.yaml
        contains: "4/4 rolled back"

  - name: Rollback recreates every original namespaced resource
    timeout: 30s
    kubectl:
      get:
        - kind: appconfigs.demo.inrun.dev
          name: payments
          namespace: team-a
          json:
            - path: .spec.image
              equals: myapp/payments:1.0.0
            - path: .spec.scaling.min
              equals: 6
            - path: .spec.observability.logging.level
              equals: info
        - kind: appconfigs.demo.inrun.dev
          name: search
          namespace: team-b
          json:
            - path: .spec.image
              equals: myapp/search:1.0.0
            - path: .spec.scaling.min
              equals: 3
            - path: .spec.observability.logging.level
              equals: warn
        - kind: appconfigs.demo.inrun.dev
          name: payments-team-c
          namespace: team-c
          json:
            - path: .spec.image
              equals: myapp/payments:1.0.0
            - path: .spec.scaling.min
              equals: 2
            - path: .spec.observability.logging.level
              equals: debug
        - kind: appconfigs.demo.inrun.dev
          name: ledger
          namespace: team-d
          json:
            - path: .spec.image
              equals: myapp/ledger:1.0.0
            - path: .spec.scaling.min
              equals: 4
            - path: .spec.observability.logging.level
              equals: info

  - name: Rollback restores the original source statuses
    timeout: 30s
    kubectl:
      get:
        - kind: appconfigs.demo.inrun.dev
          name: payments
          namespace: team-a
          field: .status.phase
          equals: Ready
        - kind: appconfigs.demo.inrun.dev
          name: search
          namespace: team-b
          field: .status.phase
          equals: Ready
        - kind: appconfigs.demo.inrun.dev
          name: ledger
          namespace: team-d
          field: .status.phase
          equals: Ready
        - kind: appconfigs.demo.inrun.dev
          name: payments-team-c
          namespace: team-c
          field: .status.phase
          equals: Pending

  - name: Rollback deletes all cluster-scoped destinations
    timeout: 30s
    resources:
      - kind: appconfigs.platform.demo.inrun.dev
        count: 0

  - name: All four original namespaced sources exist after rollback
    timeout: 30s
    kubectl:
      get:
        - kind: appconfigs.demo.inrun.dev
          name: payments
          namespace: team-a
          field: .metadata.name
          equals: payments
        - kind: appconfigs.demo.inrun.dev
          name: search
          namespace: team-b
          field: .metadata.name
          equals: search
        - kind: appconfigs.demo.inrun.dev
          name: payments-team-c
          namespace: team-c
          field: .metadata.name
          equals: payments-team-c
        - kind: appconfigs.demo.inrun.dev
          name: ledger
          namespace: team-d
          field: .metadata.name
          equals: ledger
