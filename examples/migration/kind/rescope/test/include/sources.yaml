# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
# Sources: the namespaced AppConfigs, and validation of the rescope
expect:
  - name: All four namespaced AppConfigs exist
    timeout: 30s
    kubectl:
      get:
        - kind: appconfigs.demo.inrun.dev
          name: payments
          namespace: team-a
          field: .metadata.name
          equals: payments
        - kind: appconfigs.demo.inrun.dev
          name: search
          namespace: team-b
          field: .metadata.name
          equals: search
        - kind: appconfigs.demo.inrun.dev
          name: payments
          namespace: team-c
          field: .metadata.name
          equals: payments
        - kind: appconfigs.demo.inrun.dev
          name: ledger
          namespace: team-d
          field: .metadata.name
          equals: ledger

  - name: Validate source and cluster-scoped destination CRDs
    timeout: 30s
    commands:
      - run: inrun validate -f ../../blueprint.yaml
        contains: "2 CRDs valid (0 built-in, 2 custom)"

  - name: Validation warns that namespaced sources can collide
    timeout: 30s
    commands:
      - run: inrun validate -f ../../blueprint.yaml
        contains: "sources with the same name in different namespaces will fail as collisions"

  # --- dry-run: collision is detected before any write ---
