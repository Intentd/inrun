# platform-04..06: tier=batch, with source annotations that should be
# preserved (PreserveSource default) or dropped (PreserveSource: false).
# status.phase=Pending so the condition fixture excludes them.
apiVersion: demo.inrun.dev/v1
kind: AppConfig
metadata:
  name: api-server
  namespace: platform-04
  labels:
    app: demo
    tier: batch
  annotations:
    example.io/owner: "team-batch"
    example.io/created-by: "platform-team"
spec:
  image: "myapp/api:2.2.0"
  scaling:
    min: 6
  observability:
    logging:
      level: "warn"
status:
  phase: Pending
  endpoint: ""
