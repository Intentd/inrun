# platform-01..03: tier=web, no source annotations.
# Selector `tier=web` and condition `status.phase=Ready` select this group.
apiVersion: demo.inrun.dev/v1
kind: AppConfig
metadata:
  name: api-server
  namespace: platform-01
  labels:
    app: demo
    tier: web
spec:
  image: "myapp/api:2.2.0"
  scaling:
    min: 6
  observability:
    logging:
      level: "warn"
status:
  phase: Ready
  endpoint: "api-server.platform-01.svc.cluster.local"
