# platform-07..09: tier=internal, with Inrun provenance annotations.
# These are the annotations the migration's declared metadata must override
# when PreserveSource is false, or inherit when PreserveSource is true.
apiVersion: demo.inrun.dev/v1
kind: AppConfig
metadata:
  name: api-server
  namespace: platform-07
  labels:
    app: demo
    tier: internal
  annotations:
    inrun.dev/serve-target: appconfig
    inrun.dev/serve-intent: '{"image":"myapp/api:2.2.0","replicas":6}'
spec:
  image: "myapp/api:2.2.0"
  scaling:
    min: 6
  observability:
    logging:
      level: "warn"
status:
  phase: Ready
  endpoint: "api-server.platform-07.svc.cluster.local"
---
