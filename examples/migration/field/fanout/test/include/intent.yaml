# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
# Intent: the flat cron string fans out to the structured spec, and invalid ones are refused
expect:
  - name: Gateway accepts flat cron string and fans out to structured spec
    timeout: 60s
    kubectl:
      port-forward:
        - service: inrun-gateway
          namespace: inrun-system
          port: 8080
          path: /api/v1/apply
          method: POST
          headers:
            Authorization: "Bearer ${DEV_TOKEN}"
            Content-Type: "application/json"
          body: |-
            {
              "target": "cronjob",
              "name": "daily-backup",
              "schedule": "0 2 * * 1-5",
              "image": "busybox:latest"
            }
          statusCode: 200

  - name: Serve translation fans cron string out to structured spec fields
    timeout: 60s
    kubectl:
      get:
        - kind: cronjobs.demo.inrun.dev
          name: daily-backup
          namespace: default
          field: .spec.schedule.minute
          equals: "0"
        - kind: cronjobs.demo.inrun.dev
          name: daily-backup
          namespace: default
          field: .spec.schedule.hour
          equals: "2"
        - kind: cronjobs.demo.inrun.dev
          name: daily-backup
          namespace: default
          field: .spec.schedule.dayOfWeek
          equals: "1-5"

  - name: Invalid cron string is rejected at intent gate
    timeout: 30s
    kubectl:
      port-forward:
        - service: inrun-gateway
          namespace: inrun-system
          port: 8080
          path: /api/v1/apply
          method: POST
          headers:
            Authorization: "Bearer ${DEV_TOKEN}"
            Content-Type: "application/json"
          body: |-
            {
              "target":"cronjob",
              "name":"bad-cron",
              "schedule":"not-a-cron",
              "image":"busybox:latest"
            }
          contains: '"accepted":false'
