# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: cronjob-operator
  version: 0.1.0
  description: >
    CronJob operator demonstrating schema evolution via inrun migrate.
    Callers submit a flat cron string; serve.fields.values fans it out to five
    structured schedule fields. The migrate.from entry on the schedule field
    lets inrun migrate backfill existing CRs that were written with a flat
    spec.schedule string before the structured schema was introduced.

gateway:
  api:
    enabled: true
    auth:
      tokens:
        - name: dev
          token: "${DEV_TOKEN}"

spec:
  crds:
    cronjob:
      crdFile: ./manifests/crd.yaml
      serve:
        enabled: true
        target: cronjob
        namespace: default
        include: ./serve/cronjob.yaml
        tokens:
          dev:
            permissions:
              global: ["*"]

      admission:
        mutation:
          mutateFirst: true
          rules:
            - field: spec.concurrencyPolicy
              default: "Allow"
            - field: spec.successfulJobsHistoryLimit
              default: 3
              valueType: int
            - field: spec.failedJobsHistoryLimit
              default: 1
              valueType: int
            - field: spec.suspend
              default: false

        validation:
          rules:
            - field: "{{ cronValid .intent.schedule }}"
              equals: "true"
              link: schedule
              fires:
                reconcile: false
              message: 'schedule must be a valid cron expression (e.g. "*/5 * * * *")'
              action: deny

            - field: spec.image
              exists: true
              message: "image is required"
              action: deny

      operatorBox:
        reconcile:
          workers: 5
          resync: 45s
          onCreate:
            cronJobs:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                schedule: "{{ cronFromAny .spec.schedule }}"
                suspend: "{{ .spec.suspend }}"
                successfulJobsHistoryLimit: "{{ .spec.successfulJobsHistoryLimit }}"
                failedJobsHistoryLimit: "{{ .spec.failedJobsHistoryLimit }}"
                concurrencyPolicy: "{{ .spec.concurrencyPolicy }}"
                reconcile: true

        emit:
          status:
            fields:
              - path: phase
                value: '{{ boolTernary .spec.suspend "Suspended" "Active" }}'
              - path: scheduleExpression
                value: "{{ cronFromAny .spec.schedule }}"
              - path: image
                value: "{{ .spec.image }}"
