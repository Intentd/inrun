---
# Old CronJob CRD — spec.schedule is a flat cron string.
# Apply this first to set up the before-state.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cronjobs.demo.inrun.dev
spec:
  group: demo.inrun.dev
  scope: Namespaced
  names:
    plural: cronjobs
    singular: cronjob
    kind: CronJob
    shortNames: [cj]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, schedule]
              properties:
                image:
                  type: string
                schedule:
                  type: string
                concurrencyPolicy:
                  type: string
                  enum: [Allow, Forbid, Replace]
                  default: Allow
                suspend:
                  type: boolean
                  default: false
                successfulJobsHistoryLimit:
                  type: integer
                  default: 3
                failedJobsHistoryLimit:
                  type: integer
                  default: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
