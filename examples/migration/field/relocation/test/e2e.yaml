# yaml-language-server: $schema=https://inrun.dev/schema/v1/e2e.json
apiVersion: inrun.dev/v1
kind: E2E
metadata:
  name: relocation-e2e
  description: >
    AppConfig operator where two fields move to new nested paths
    (spec.replicas → spec.scaling.min, spec.logLevel →
    spec.observability.logging.level). Verifies that the gateway migrates
    existing flat-schema CRs on startup against the transitional CRD, that a
    flat caller intent submitted via the gateway lands in the nested shape,
    and that applying the final CRD afterwards does not prune any CR.

spec:
  blueprint: ../blueprint.yaml
  crd: ../manifests/old-crd.yaml
  valuesFiles:
    - ./e2e-values.yaml
  setup:
    - ../manifests/namespaces.yaml
    - ../manifests/old-crs.yaml           # 8 old flat-schema CRs
    - ../manifests/crd-transitional.yaml  # declares old + new fields
    - ../manifests/new-crs.yaml

  runtime:
    enabled: false
  cluster:
    provider: kind
    name: inrun-e2e
    reuse: false

  env:
    DEV_TOKEN: dev-token
  expect:
    - include: ./include/startup.yaml
    - include: ./include/migrate-crs.yaml
    - include: ./include/intent.yaml
    - include: ./include/drift-rollback.yaml
    - include: ./include/prune-safe.yaml
