# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
# Prune-safe: apply the final CRD; every CR keeps its new fields and drops the old ones
expect:
  - name: Apply the final CRD
    timeout: 30s
    kubectl:
      apply:
        - file: ../../manifests/crd-final.yaml

  - name: All CRs survive the final CRD — old fields pruned, new fields intact
    timeout: 30s
    kubectl:
      get:
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-01
          field: .spec.scaling.min
          equals: "3"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-02
          field: .spec.scaling.min
          equals: "5"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-03
          field: .spec.scaling.min
          equals: "2"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-04
          field: .spec.scaling.min
          equals: "10"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-05
          field: .spec.scaling.min
          equals: "1"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-06
          field: .spec.scaling.min
          equals: "6"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-07
          field: .spec.scaling.min
          equals: "7"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-08
          field: .spec.scaling.min
          equals: "3"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-09
          field: .spec.scaling.min
          equals: "3"
        - kind: appconfigs.demo.inrun.dev
          name: api-server
          namespace: platform-09
          field: .spec.observability.logging.level
          equals: "info"

