apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appconfigs.demo.inrun.dev
spec:
  group: demo.inrun.dev
  names:
    kind: AppConfig
    plural: appconfigs
    singular: appconfig
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                logLevel:
                  type: string
                  enum: ["debug", "info", "warn", "error"]
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: LogLevel
          type: string
          jsonPath: .spec.logLevel
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
