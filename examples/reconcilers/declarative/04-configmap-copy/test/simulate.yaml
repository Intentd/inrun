# yaml-language-server: $schema=https://inrun.dev/schema/v1/simulate.json
apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: configmap-distribution-sim
  description: >
    Demonstrates that inrun simulate detects cross-namespace copy operations
    and skips them gracefully. The ConfigMap copy requires a live API server to
    read the source ConfigMap — simulate prints a note and exits cleanly.

spec:
  blueprint: ../blueprint.yaml
  cr: ../manifests/cr.yaml
  cycles: 1

  expect:
    steady: false
    noErrors: true
