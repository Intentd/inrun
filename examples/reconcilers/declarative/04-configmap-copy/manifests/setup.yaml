---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-alpha
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-beta
---
# The source ConfigMap that will be copied to team namespaces
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: platform
data:
  host: "service.platform.svc.cluster.local"
  port: "8080"
  logLevel: "info"
