apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configmapdistributions.demo.inrun.dev
spec:
  group: demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [configMapName, targetNamespaces]
              properties:
                configMapName:
                  type: string
                  description: Name of the ConfigMap to copy, in the CR's namespace
                targetNamespaces:
                  type: array
                  items:
                    type: string
                  description: Namespaces to copy the ConfigMap into
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: ConfigMapDistribution
    plural: configmapdistributions
    singular: configmapdistribution
    shortNames:
      - cd
  scope: Namespaced  # Lives beside the ConfigMap it shares
