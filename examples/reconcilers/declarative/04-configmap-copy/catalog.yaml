apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: configmap-distribution
  author: intentd
  version: 0.1.0
  description: >
    Demonstrates built-in kind enrichment and cross-namespace ConfigMap distribution.
    Inrun watches the ConfigMapDistribution CRD and copies a named ConfigMap
    from a source namespace into every target namespace declared in the CR.

spec:
  crds:
    configmap-distribution:
      crdFile: ./manifests/crd.yaml
      crFiles:
        - ./manifests/cr.yaml
      setup:
        apply:
          - ./manifests/setup.yaml
        wait:
          - kind: ConfigMap
            name: app-config
            namespace: platform
            timeout: 15s
      namespaced: false             # Default: (true)
      operatorBox:
        reconcile:
          onCreate:
            configMaps:
              - name: "{{ .spec.configMapName }}"
                fromConfigMap: "{{ .spec.configMapName }}"
                fromNamespace: "{{ .spec.sourceNamespace }}"
                # toNamespaces copies the ConfigMap to each target namespace.
                # Each element supports template expressions.
                toNamespaces:
                  - "{{ .spec.targetNamespaces }}"
                reconcile: true   # re-sync if source ConfigMap changes
        emit:
          status:
            fields:
              - path: phase
                value: "Distributed"
              - path: sourceConfigMap
                value: "{{ .spec.configMapName }}"
              - path: sourceNamespace
                value: "{{ .spec.sourceNamespace }}"

