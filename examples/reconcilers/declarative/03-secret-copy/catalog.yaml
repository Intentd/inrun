apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: secret-distribution
  author: intentd
  version: 0.1.0
  tags:
    - secret
    - security
    - namespace
  description: >
    Demonstrates built-in kind enrichment and cross-namespace secret distribution.
    Inrun watches the SecretDistribution CRD and copies a named Secret
    from a source namespace into every target namespace declared in the CR.

spec:
  crds:
    secret-distribution:
      crdFile: ./manifests/crd.yaml
      crFiles:
        - ./manifests/cr.yaml
      setup:
        apply:
          - ./manifests/setup.yaml
        wait:
          - kind: Secret
            name: database-credentials
            namespace: platform
            timeout: 15s
      namespaced: false             # Default: (true)
      operatorBox:
        reconcile:
          onCreate:
            secrets:
              - name: "{{ .spec.secretName }}"
                fromSecret: "{{ .spec.secretName }}"
                fromNamespace: "{{ .spec.sourceNamespace }}"
                # toNamespaces copies the secret to each target namespace.
                # Each element supports template expressions.
                toNamespaces: 
                  - "{{ .spec.targetNamespaces }}"
                reconcile: true   # re-sync if source secret changes
        emit:
          status:
            fields:
              - path: phase
                value: "Distributed"
              - path: sourceSecret
                value: "{{ .spec.secretName }}"
              - path: sourceNamespace
                value: "{{ .spec.sourceNamespace }}"

