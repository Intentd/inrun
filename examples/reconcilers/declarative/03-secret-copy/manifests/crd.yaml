apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretdistributions.demo.inrun.dev
spec:
  group: demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [secretName, sourceNamespace, targetNamespaces]
              properties:
                secretName:
                  type: string
                  description: Name of the Secret to copy
                sourceNamespace:
                  type: string
                  description: Namespace where the source Secret lives
                targetNamespaces:
                  type: array
                  items:
                    type: string
                  description: Namespaces to copy the Secret into
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: SecretDistribution
    plural: secretdistributions
    singular: secretdistribution
    shortNames:
      - sd
  scope: Cluster  # This is so it can distribute to all namespaces
