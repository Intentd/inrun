apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: hello-website-sim
  description: Verify the Deployment and Service are applied in cycle 1

spec:
  blueprint: ../blueprint.yaml
  cr: ../manifests/cr.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
        name: hello-website
      - cycle: 1
        verb: apply
        resource: services
        name: hello-website-svc
