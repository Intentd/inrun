apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelines.demo.inrun.dev
spec:
  group: demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, steps]
              properties:
                image:
                  type: string
                  description: Runner image for pipeline steps
                steps:
                  type: array
                  items:
                    type: object
                    required: [name, command]
                    properties:
                      name:
                        type: string
                      command:
                        type: array
                        items:
                          type: string
                timeout:
                  type: string
                  default: "1h"
                  description: Pipeline timeout e.g. "30m", "2h"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Pipeline
    plural: pipelines
    singular: pipeline
  scope: Namespaced
