apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.migration.demo.inrun.dev
spec:
  group: migration.demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  default: 1
                port:
                  type: integer
                  default: 80
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: WebApp
    plural: webapps
    singular: webapp
  scope: Namespaced
