apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buckets.storage.demo.inrun.dev
spec:
  group: storage.demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [quotaGB]
              properties:
                quotaGB:
                  type: integer
                  minimum: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Bucket
          type: string
          jsonPath: .status.bucketId
        - name: State
          type: string
          jsonPath: .status.state
  names:
    kind: Bucket
    plural: buckets
    singular: bucket
  scope: Namespaced
