# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
# Reconcile: the remote reconciler answers and Inrun writes the CR
expect:
  - name: WebApp CR created
    after: cr-applied
    timeout: 30s
    resources:
      - kind: WebApp
        name: my-webapp
        namespace: default

  - name: Inrun's finalizer on the CR
    after: cr-applied
    timeout: 30s
    kubectl:
      get:
        - kind: WebApp
          name: my-webapp
          namespace: default
          field: .metadata.finalizers[0]
          equals: inrun.dev/cleanup

  - name: Status written by reconciler
    after: cr-applied
    timeout: 60s
    kubectl:
      get:
        - kind: WebApp
          name: my-webapp
          namespace: default
          field: .status.phase
          equals: Running
        - kind: WebApp
          name: my-webapp
          namespace: default
          field: .status.endpoint
          equals: my-webapp-svc.default.svc.cluster.local

  - name: Labels and annotations set on the CR
    after: cr-applied
    timeout: 60s
    kubectl:
      get:
        - kind: WebApp
          name: my-webapp
          namespace: default
          field: .metadata.labels.environment
          equals: development
        - kind: WebApp
          name: my-webapp
          namespace: default
          field: .metadata.annotations.webapp\.example\.com/image
          equals: nginx:1.25
