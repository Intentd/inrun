# Schema reference: https://inrun.dev/docs/reference/schema/blueprint/
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: webapp-remote
  author: myorg
  version: 1.0.0
  description: >
    The WebApp operator as a remote HTTP reconciler.
    The reconciler is a bash script — no Go, no image build, no Kubernetes SDK.
    Inrun owns the queue, backoff, informer, owner references, SSA, and health.
    The script owns the Deployment and Service specs.
  tags:
    - migration
    - remote

functions:
  definitions:
    - name: reconcilerEndpoint
      description: Remote reconciler HTTP endpoint — its in-cluster Service, or localhost when inrun runs outside the cluster
      expression: >
        {{ if .inrun.inPod }}
          http://webapp-reconciler.default.svc.cluster.local:8025/reconcile
        {{ else }}
          http://localhost:8025/reconcile
        {{ end }}

spec:
  crds:
    webapp:
      crdFile: ./manifests/crd.yaml
      crFiles:
        - ./manifests/cr.yaml
      setup:
        - ./manifests/secret.yaml
      operatorBox:
        reconcile:
          default: false
          managedResources:
            - kind: deployment
            - kind: service
          # Delete a child the reconciler stops returning (the Service when
          # spec.expose is false).
          prune:
            enabled: true
          args:
            logLevel: info
            environment: '{{ .metadata.labels.environment | default "development" }}'
            appName: "{{ .metadata.name }}"
          remote:
            endpoint: "{{ reconcilerEndpoint }}"
            timeout: 15s
            auth:
              secretRef:
                name: webapp-reconciler-token
                namespace: default
                key: token
            request:
              object:
                exclude:
                  - metadata.managedFields
        runtime:
          allowedNamespaces:
            - default
