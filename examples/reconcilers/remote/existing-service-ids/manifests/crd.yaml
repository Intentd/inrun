apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: volumes.storage.demo.inrun.dev
spec:
  group: storage.demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [sizeGB]
              properties:
                sizeGB:
                  type: integer
                  minimum: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Volume
          type: string
          jsonPath: .status.volumeId
        - name: State
          type: string
          jsonPath: .status.state
  names:
    kind: Volume
    plural: volumes
    singular: volume
  scope: Namespaced
