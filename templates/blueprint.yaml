# Schema reference: https://inrun.dev/docs/reference/schema/blueprint/
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: <operator-name>
  author: <your-name>
  version: 0.1.0
  description: <what this operator does>
  tags:
    - <tag>

spec:
  crds:
    <crd-name>:
      crdFile: ./crd.yaml          # Inrun applies the CRD at startup

      operatorBox:
        runtime:
          # allowedNamespaces:     # omit to watch all namespaces
          #   - default

        reconcile:
          # default: true         # Omit to use defaults
          # workers: 4
          # resync: 30s
          # queue:
          #   maxDepth: 100

          # ── On Create ────────────────────────────────────────────────────
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                reconcile: true      # re-apply on every reconcile (drift correction)

            services:
              - name: "{{ .metadata.name }}-svc"
                port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true

        # ── Status ───────────────────────────────────────────────────────
        # emit:
        #   status:
        #     fields:
        #       - path: phase
        #         value: "Running"
        #       - path: observedReplicas
        #         value: "{{ .spec.replicas }}"
