<nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="navbar-inner">
    <!-- Logo -->
    <a href="/" class="navbar-logo" aria-label="Inrun home">
      {{ partial "wordmark.html" 32 }}
    </a>

    <!-- Desktop nav links -->
    <ul class="navbar-links" role="list">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}" class="navbar-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}"
          {{ if strings.HasPrefix .URL "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>
          {{ .Name }}
          {{ if strings.HasPrefix .URL "http" }}
          <svg class="external-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/>
          </svg>
          {{ end }}
        </a>
      </li>
      {{ end }}
    </ul>

    <!-- Right controls -->
    <div class="navbar-controls">
      <!-- Control Center link -->
      <a href="{{ .Site.Params.controlcenter }}" class="btn-controlcenter" target="_blank" rel="noopener noreferrer" aria-label="Open Control Center">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </svg>
        Control Center
        <span class="cc-live-dot" title="Live instance"></span>
      </a>

      <!-- GitHub button -->
      <a href="{{ .Site.Params.github }}" class="btn-github" target="_blank" rel="noopener noreferrer" aria-label="View on GitHub">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        <span>GitHub</span>
      </a>

      <!-- Dark mode toggle -->
      <button class="btn-theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>

      <!-- Mobile hamburger -->
      <button class="btn-hamburger" id="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="navbar-mobile" id="mobile-menu" aria-hidden="true">
    <ul role="list">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}" class="navbar-mobile-link"
          {{ if strings.HasPrefix .URL "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>
          {{ .Name }}
        </a>
      </li>
      {{ end }}
      <li class="navbar-mobile-divider"></li>
      <li>
        <a href="{{ .Site.Params.github }}" class="navbar-mobile-link" target="_blank" rel="noopener noreferrer">
          GitHub
        </a>
      </li>
      <li>
        <a href="{{ .Site.Params.controlcenter }}" class="navbar-mobile-link" target="_blank" rel="noopener noreferrer">
          Control Center
        </a>
      </li>
    </ul>
  </div>
</nav>
