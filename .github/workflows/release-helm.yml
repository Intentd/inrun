name: Release Helm Chart

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Container image tag (without v prefix)'
        required: true
        type: string
      repository:
        description: 'GitHub repository (owner/name) for image registry'
        required: false
        type: string
        default: ${{ github.repository }}
      inrun:
        description: 'Shorthand for inrun (used in chart name, repo, namespace)'
        required: false
        type: string
        default: 'inrun'
      helm_repo_url:
        description: 'URL of the Helm repository (GitHub Pages)'
        required: false
        type: string
        default: 'https://inrundev.github.io/inrun'
      helm_chart:
        description: 'Helm chart reference (repo/chart) – used in summary'
        required: false
        type: string
        default: ${{ github.repository }}

jobs:
  chart-e2e:
    name: Gate — Helm chart e2e
    uses: ./.github/workflows/inrun-chart-e2e.yml
    with:
      image_tag: ${{ inputs.image_tag }}
      repository: ${{ inputs.repository }}
      inrun: ${{ inputs.inrun }}

  helm:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    # needs: chart-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Chart metadata and values
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          yq eval ".version = \"${VERSION}\"" -i charts/${{ inputs.inrun }}/Chart.yaml
          yq eval ".appVersion = \"${{ inputs.image_tag }}\"" -i charts/${{ inputs.inrun }}/Chart.yaml
          yq eval ".runtime.image.tag = \"${{ inputs.image_tag }}\"" -i charts/${{ inputs.inrun }}/values.yaml
          yq eval ".runtime.image.repository = \"ghcr.io/${{ inputs.repository }}\"" -i charts/${{ inputs.inrun }}/values.yaml
          yq eval ".gateway.image.tag = \"${{ inputs.image_tag }}\"" -i charts/${{ inputs.inrun }}/values.yaml
          yq eval ".gateway.image.repository = \"ghcr.io/${{ inputs.repository }}-gateway\"" -i charts/${{ inputs.inrun }}/values.yaml
          yq eval ".console.image.tag = \"${{ inputs.image_tag }}\"" -i charts/${{ inputs.inrun }}/values.yaml
          yq eval ".console.image.repository = \"ghcr.io/${{ inputs.repository }}-console\"" -i charts/${{ inputs.inrun }}/values.yaml

      - name: Package Helm chart and push to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          INRUN="${{ inputs.inrun }}"
          CHART_DIR="charts/${INRUN}"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          IMAGE_TAG="${{ inputs.image_tag }}"

          helm package "$CHART_DIR" \
            --version "$VERSION" --app-version "$IMAGE_TAG" \
            -d .cr-release-packages

          git clone --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages

          cp ".cr-release-packages/${INRUN}-${VERSION}.tgz" /tmp/gh-pages/

          # Sync README with version badges
          cp "${CHART_DIR}/README.md" /tmp/gh-pages/README.md
          VERSION_BADGE="${VERSION//-/--}"
          IMAGE_TAG_BADGE="${IMAGE_TAG//-/--}"
          awk 'NR==1{print; print ""; print "![Chart Version](https://img.shields.io/badge/chart%20version-'"${VERSION_BADGE}"'-blue?style=flat-square) ![App Version](https://img.shields.io/badge/app%20version-'"${IMAGE_TAG_BADGE}"'-blue?style=flat-square)"; print ""; next}1' \
            /tmp/gh-pages/README.md > /tmp/README.tmp && mv /tmp/README.tmp /tmp/gh-pages/README.md

          cp "charts/${INRUN}/values.yaml" /tmp/gh-pages/values.yaml

          cd /tmp/gh-pages
          if [[ -f index.yaml ]]; then
            helm repo index . --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" --merge index.yaml
          else
            helm repo index . --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.tgz" index.yaml README.md values.yaml
          git commit -m "Release ${INRUN}-${VERSION}"
          git push origin gh-pages

      - name: Write summary
        run: |
          echo "### ⎈ Helm chart published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "helm repo add ${{ inputs.inrun }} ${{ inputs.helm_repo_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "helm repo update" >> "$GITHUB_STEP_SUMMARY"
          echo "helm upgrade --install ${{ inputs.inrun }} ${{ inputs.helm_chart }} --namespace ${{ inputs.inrun }}-system --create-namespace" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
