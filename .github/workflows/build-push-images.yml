          LDFLAGS="-X github.com/intentd/inrun/console/version.Version=${{ github.ref_name }} -X github.com/intentd/inrun/console/version.Commit=${{ github.sha }} -X github.com/intentd/inrun/console/version.Date=$DATE"
          cd ./cmd/console
          for arch in amd64 arm64; do
            echo "Building inrun-console-$arch"
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w $LDFLAGS" \
              -o inrun-console-$arch .
          done

      - name: Build and push console image
        uses: docker/build-push-action@v7
        with:
          context: cmd/console
          file: cmd/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.image_tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image summary
        run: |
          echo "## Console Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ inputs.repository }}-console:${{ inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-devserver:
    name: Build and Push Dev Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
