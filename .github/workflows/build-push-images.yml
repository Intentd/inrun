        with:
          images: ghcr.io/${{ inputs.repository }}-dev-server
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.image_tag }}
            type=raw,value=latest

      - name: Cache compiled Linux binaries
        id: cache-binaries
        uses: actions/cache@v5
