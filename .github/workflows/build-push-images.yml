          LDFLAGS="-X github.com/intentd/inrun/pkg/util/version.Version=${{ github.ref_name }} -X github.com/intentd/inrun/pkg/util/version.Commit=${{ github.sha }} -X github.com/intentd/inrun/pkg/util/version.Date=$DATE"
          for arch in amd64 arm64; do
            echo "Building inrun-gateway-$arch"
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build \
              -tags gateway \
