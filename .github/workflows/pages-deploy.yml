      #     CONFIG=$(cat website/docsearch-config.json)
      #     docker run --rm \
      #       -e APPLICATION_ID="${ALGOLIA_APP_ID}" \
      #       -e API_KEY="${ALGOLIA_WRITE_KEY}" \
      #       -e CONFIG="${CONFIG}" \
