# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: hello-website
  version: 0.1.0
  description: Fixture blueprint for chart e2e — one CRD, one Deployment, one Service.

security:
  namespaceProtection:
    enabled: true
    cleanupOnShutdown: true

gateway:
  enabled: true

spec:
  crds:
    website:
      apiTypes:
        group: demo.inrun.dev
        version: v1alpha1
        kind: Website
        plural: websites
      operatorBox:
        reconcile:
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true
            services:
              - name: "{{ .metadata.name }}-svc"
                port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
        runtime:
          allowedNamespaces:
            - default
