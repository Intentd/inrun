{{- if .Values.console.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "inrun.fullname" . }}-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inrun.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
    inrun.dev/component: console
  {{- with .Values.console.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.console.service.type }}
  selector:
    {{- include "inrun.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP

{{- end }}