# yaml-language-server: $schema=https://inrun.dev/schema/v1/e2e.json
apiVersion: inrun.dev/v1
kind: E2E
metadata:
  name: inrun-chart-e2e
  description: >
    custom.target: kubernetes — Inrun Helm chart installed via setup.helm
    with gateway enabled. CRD, bundle, and fixture CR are applied before the
    chart so Inrun reconciles on first boot. Asserts that all three
    deployments are ready, that conditional templates are not created when their
    flags are off (default values), and that the runtime reconciles the fixture
    CR producing a Deployment and Service.

spec:
  custom:
    target: kubernetes

  cluster:
    provider: kind
    name: inrun-chart-e2e
    reuse: false

  setup:
    apply:
      - path: fixtures/crd.yaml
        wait:
          - kind: CustomResourceDefinition
            name: websites.demo.inrun.dev
            timeout: 30s
      - path: fixtures/inrun-bundle.yaml
        wait:
          - kind: ConfigMap
            name: inrun-blueprint
            namespace: inrun-system
            timeout: 30s
      - path: fixtures/cr.yaml
        wait:
          - kind: Website
            name: hello-website
            namespace: default
            timeout: 30s
    helm:
      - chart: ./
        release: inrun
        namespace: inrun-system
        createNamespace: true
        values:
          gateway.enabled: true
          gateway.image.tag: 0.1.0-rc
          runtime.image.tag: 0.1.0-rc
          console.image.tag: 0.1.0-rc
        wait:
          - kind: Deployment
            name: inrun-runtime
            namespace: inrun-system
            ready: true
            timeout: 120s
          - kind: Deployment
            name: inrun-gateway
            namespace: inrun-system
            ready: true
            timeout: 120s
          - kind: Deployment
            name: inrun-console
            namespace: inrun-system
            ready: true
            timeout: 120s

  expect:
    - include: ./include/infra-ready.yaml
    - include: ./include/defaults.yaml
    - include: ./include/fixture.yaml
    - include: ./include/cleanup.yaml

  onFailure:
    kubectl:
      logs:
        - leaderElection:
            lease: inrun-leader
          namespace: inrun-system
          since: 5m
        - labelSelector: app.kubernetes.io/component=gateway
          namespace: inrun-system
          since: 5m
      describe:
        - kind: Deployment
          name: inrun-runtime
          namespace: inrun-system
        - kind: Deployment
          name: inrun-gateway
          namespace: inrun-system
      events:
        - kind: Deployment
          name: inrun-runtime
          namespace: inrun-system
        - kind: Deployment
          name: inrun-gateway
          namespace: inrun-system
