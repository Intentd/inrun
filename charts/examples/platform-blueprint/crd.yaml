---
# Cache CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: caches.demo.inrun.dev
spec:
  group: demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [backend]
              properties:
                backend:
                  type: string
                  description: Cache backend type (e.g., redis, memcached)
                size:
                  type: string
                  description: Optional size or tier identifier
  names:
    kind: Cache
    plural: caches
    singular: cache
  scope: Namespaced

# Database CRD
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.demo.inrun.dev
spec:
  group: demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [engine]
              properties:
                engine:
                  type: string
                  description: Database engine type (e.g., postgres, mysql)
                version:
                  type: string
                  description: Optional engine version
  names:
    kind: Database
    plural: databases
    singular: database
  scope: Cluster

