apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: {{ .Release.Name }}-catalog
  version: 0.1.0
  author: intentd
  description: >
    catalog.yaml Helm template — renders an Inrun Catalog from Helm values.
    Inrun's merger reads this template's output and extracts CRD definitions.
    The chart must render at least one template with kind Catalog.
  tags:
    - helm
    - composition
    - data

spec:
  crds:
    {{- range $name, $crd := .Values.crds }}
    {{ $name }}:
      enabled: {{ if hasKey $crd "enabled" }}{{ $crd.enabled }}{{ else }}true{{ end }}
      namespaced: {{ if hasKey $crd "namespaced" }}{{ $crd.namespaced }}{{ else }}true{{ end }}
      operatorBox:
        reconcile:
          workers: {{ $crd.reconcile.workers | default 2 }}
          resync: {{ $crd.reconcile.resync | default "30s" }}

      apiTypes:
        group: {{ $.Values.apiGroup }}
        version: {{ $.Values.apiVersion | default "v1alpha1" }}
        kind: {{ $crd.kind }}
        plural: {{ $crd.plural }}
      description: {{ $crd.description | default "" | quote }}
    {{- end }}