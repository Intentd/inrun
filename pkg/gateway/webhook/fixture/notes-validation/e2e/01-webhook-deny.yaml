expect:
  - name: bad image rejected by webhook at apply time
    after: cr-applied
    timeout: 30s
    commands:
      - run: kubectl apply -f ../cr-bad-image.yaml
        exitCode: 1
        outputContains: "denied the request"

  - name: webhook denial message contains allowedRegistry note value
    after: cr-applied
    timeout: 30s
    commands:
      - run: kubectl apply -f ../cr-bad-image.yaml
        exitCode: 1
        outputContains: "image must be from myorg/"
