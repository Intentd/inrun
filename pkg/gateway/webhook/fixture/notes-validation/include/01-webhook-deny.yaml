# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
expect:
  - name: bad image rejected by webhook at apply time
    after: cr-applied
    timeout: 30s
    commands:
      - run: kubectl apply -f ../cr-bad-image.yaml
        exitCode: 1
        assert:
          contains: "denied the request"

  - name: webhook denial message contains allowedRegistry note value
    after: cr-applied
    timeout: 30s
    commands:
      - run: kubectl apply -f ../cr-bad-image.yaml
        exitCode: 1
        assert:
          contains: "image must be from myorg/"
