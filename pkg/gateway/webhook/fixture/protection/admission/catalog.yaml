apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: admission
  author: intentd
  version: 0.1.0
  description: >
    Demonstrates Inrun admission webhooks: validation (deny + warn) and
    mutation (defaults). One Catalog declaration — enforced at admission time
    by a ValidatingWebhookConfiguration and MutatingWebhookConfiguration, and
    again at every reconcile cycle by the reconciler itself.

gateway:
  enabled: true     # optional if endpoint is set
  endpoint: http://inrun-gateway:8080

security:
  webhooks:
    admission:
      enabled: true
    cleanupOnShutdown: true
    failurePolicy: Ignore   # allow apply through if Inrun is temporarily unreachable

spec:
  crds:
    platform:
      apiTypes:
        group: admission.inrun.dev
        version: v1alpha1
        kind: Platform
        plural: platforms
      # ── Validation ────────────────────────────────────────────────────────
      # Rules are declared once. Enforced at:
      #   1. Admission time  — synchronously during kubectl apply (deny/warn)
      #   2. Reconcile time  — every reconcile cycle (deny halts, warn logs)
      #
      # Inrun creates a ValidatingWebhookConfiguration only when at least
      # one validation rule is declared here.
      admission:
        validation:
          rules:
            # Hard rule — image must come from the internal registry
            - field: spec.image
              prefix: "registry.internal/"
              message: "images must come from the internal registry (registry.internal/)"
              action: deny

            # Hard rule — replicas must be a positive integer
            - field: spec.replicas
              greaterThan: 0
              message: "replicas must be at least 1"
              action: deny

            # Hard rule — environment must be a known value
            - field: spec.environment
              operator: in
              value: "development,staging,production"
              message: "environment must be one of: development, staging, production"
              action: deny

            # Advisory — rateLimit should be set explicitly for production
            - field: spec.rateLimit
              operator: exists
              message: "declare spec.rateLimit for production readiness"
              action: warn

        # ── Mutation ────────────────────────────────────────────────────────
        # Defaults are applied BEFORE validation runs — so a CR with no
        # replicas field passes the replicas > 0 rule because mutation set it.
        #
        # Inrun creates a MutatingWebhookConfiguration only when at least
        # one mutation rule is declared here.
        mutation:
          mutateFirst: true     # at reconcile time: mutate before validate
          rules:
            - field: spec.replicas
              default: 2        # applied when spec.replicas is absent
              valueType: int    # Because the CRD expects an integer

            - field: spec.environment
              default: "development"   # applied when spec.environment is absent

            - field: spec.rateLimit
              default: 100    # applied when spec.rateLimit is absent
              valueType: int  # Because the CRD expects an integer
      operatorBox:
        reconcile:
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-platform"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "8080"
                reconcile: true

            services:
              - name: "{{ .metadata.name }}-svc"
                port: "80"
                targetPort: "8080"
                reconcile: true
        # Status fields reflect the object AFTER mutation — so you can see
        # what Inrun filled in even if the CR did not declare it.
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: image
                value: "{{ .spec.image }}"
              - path: environment
                value: "{{ .spec.environment }}"
              - path: replicas
                value: "{{ .spec.replicas }}"
              - path: rateLimit
                value: "{{ .spec.rateLimit }}"

