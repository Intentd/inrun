apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platforms.admission.inrun.dev
spec:
  group: admission.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .status.environment
        - name: Replicas
          type: string
          jsonPath: .status.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                environment:
                  type: string
                  enum: [development, staging, production]
                rateLimit:
                  type: integer
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: Platform
    plural: platforms
    singular: platform
  scope: Namespaced
