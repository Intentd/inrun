apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: namespace-protection
  author: intentd
  version: 0.1.0
  description: >
    Demonstrates Inrun namespace protection.
    A ValidatingWebhookConfiguration is registered that enforces namespace
    rules at admission time — CRs applied to restricted namespaces are
    rejected before they reach the reconciler.
    allowedNamespaces restricts App and Database to the "production" namespace.
    restrictedNamespaces blocks Cache from "kube-system" and "kube-public".

gateway:
  endpoint: http://inrun-gateway:8080

security:
  namespaceProtection:
    enabled: true
    cleanupOnShutdown: true
    failurePolicy: Fail

spec:
  crds:
    app:
      apiTypes:
        group: security.inrun.dev
        version: v1alpha1
        kind: App
        plural: apps
      # Only allow App CRs in the "production" namespace.
      # Applying an App CR anywhere else is rejected at admission time.
      operatorBox:
        reconcile:
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-app"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true

            services:
              - name: "{{ .metadata.name }}-svc"
                port: "80"
                targetPort: "{{ .spec.port }}"
                reconcile: true
        runtime:
          allowedNamespaces:
            - production
        emit:
          status:
            fields:
              - path: phase
                value: "Running"
              - path: image
                value: "{{ .spec.image }}"
              - path: replicas
                value: "{{ .spec.replicas }}"

    database:
      apiTypes:
        group: security.inrun.dev
        version: v1alpha1
        kind: Database
        plural: databases
      # Only allow Database CRs in the "production" namespace.
      operatorBox:
        reconcile:
          resync: 30s
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-db-config"
                reconcile: true
                data:
                  engine: "{{ .spec.engine }}"
                  storageSize: "{{ .spec.storageSize }}"
        runtime:
          allowedNamespaces:
            - production
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"
              - path: engine
                value: "{{ .spec.engine }}"

    cache:
      apiTypes:
        group: security.inrun.dev
        version: v1alpha1
        kind: Cache
        plural: caches
      # Block Cache CRs from system namespaces.
      # Cache can be applied to any other namespace.
      operatorBox:
        reconcile:
          resync: 30s
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-cache-config"
                reconcile: true
                data:
                  maxMemory: "{{ .spec.maxMemory }}"
                  evictionPolicy: "{{ .spec.evictionPolicy }}"
        runtime:
          restrictedNamespaces:
            - kube-system
            - kube-public
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"
              - path: maxMemory
                value: "{{ .spec.maxMemory }}"

