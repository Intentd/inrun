# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
expect:
  - name: delete manually applied bad-health WebApp (if any leaked through)
    after: cr-deleted
    timeout: 60s
    kubectl:
      delete:
        - kind: WebApp
          name: my-app-degraded
          namespace: default
          ignoreNotFound: true

  - name: no WebApps remain
    after: cr-deleted
    timeout: 60s
    resources:
      - kind: WebApp
        namespace: default
        count: 0
