# yaml-language-server: $schema=https://inrun.dev/schema/v1/simulate.json
apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: gateway-fixture-monitoring
  description: monitoring workload — Prometheus ServiceMonitor created on cycle 1

spec:
  blueprint: ../blueprint.yaml
  crdFiles:
    - fakecrd.yaml
    - ../crd.yaml
  setup:
    - ../setup.yaml
  cr: ../crs/monitoring-valid.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    crds:
      platFm:
        ops:
          - cycle: 1
            verb: create
            resource: servicemonitors
            name: platform-monitor
            when:
              - field: spec.environment
                equals: staging
              - field: spec.productionApproval
                exists: true

          - cycle: 1
            name: require approval in staging
            assert:
              contains: "Production Approval Ticket is required"
            when:
              - field: spec.environment
                notEquals: staging

        absent:
          - cycle: 1
            verb: create
            resource: applications
            name: platform-monitor
            when:
              - field: spec.environment
                equals: staging
              - field: spec.productionApproval
                notExists: true
