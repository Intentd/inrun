# yaml-language-server: $schema=https://inrun.dev/schema/v1/simulate.json
apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: gateway-fixture-app
  description: app workload — ArgoCD Application created on cycle 1

spec:
  blueprint: ../blueprint.yaml
  crdFiles:
    - fakecrd.yaml
    - ../crd.yaml
  setup:
    - ../setup.yaml
  cr: ../cr-default.yaml
  cycles: 3

  expect:
    steady: true
    crds:
      platFm:
        ops:
          - cycle: 1
            verb: create
            resource: applications
            name: payments-api
            when:
              - field: spec.environment
                equals: staging
              - field: spec.productionApproval
                exists: true

          - cycle: 1
            name: require approval in staging
            assert:
              contains: "Production Approval Ticket is required"
            when:
              - field: spec.environment
                notEquals: staging

        absent:
          - cycle: 1
            verb: create
            resource: applications
            name: payments-api
            when:
              - field: spec.environment
                equals: staging
              - field: spec.productionApproval
                notExists: true
              - time:
                  after: "09:00"
                  before: "17:00"
                dayOfWeek:
                  weekday: true
