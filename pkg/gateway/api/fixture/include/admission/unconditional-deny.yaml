# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
expect:
  - name: Admission blocks missing spec.team
    after: cr-applied
    timeout: 30s
    commands:
      - run: |
          kubectl apply -f - <<'EOF'
          apiVersion: gateway.fixture.inrun.dev/v1alpha1
          kind: PlatformResource
          metadata:
            name: no-team-resource
            namespace: team-payments
          spec:
            workloadType: app
            environment: staging
          EOF
        exitCode: 1
        assert:
          contains: "spec.team is required"

  - name: Admission blocks invalid workloadType
    after: cr-applied
    timeout: 30s
    commands:
      - run: |
          kubectl apply -f - <<'EOF'
          apiVersion: gateway.fixture.inrun.dev/v1alpha1
          kind: PlatformResource
          metadata:
            name: invalid-type
            namespace: team-payments
          spec:
            workloadType: unknown-type
            team: team-payments
            environment: staging
          EOF
        exitCode: 1
        assert:
          contains: "must be one of: app, cert, monitoring"
