# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-helm.json
# The argo-cd release the fixture's workloads depend on.
helm:
  - repo: https://argoproj.github.io/argo-helm
    chart: argo-cd
    namespace: argocd
    createNamespace: true
    version: "7.3.11"
    wait:
      - kind: Deployment
        name: argo-cd-argocd-server
        namespace: argocd
        ready: true
        timeout: 180s
