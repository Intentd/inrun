# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-helm.json
# The cert-manager release the fixture's workloads depend on.
helm:
  - repo: https://charts.jetstack.io
    chart: cert-manager
    namespace: cert-manager
    createNamespace: true
    version: v1.14.5
    values:
      installCRDs: true
    wait:
      - kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
        ready: true
        timeout: 120s
