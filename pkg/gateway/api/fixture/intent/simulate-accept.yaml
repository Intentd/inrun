# yaml-language-server: $schema=https://inrun.dev/schema/v1/simulate.json
apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: intent-accept
  description: >
    Asserts that a play-built PlatformResource CR reaches steady state at cycle 2
    and produces the expected finalizer and status updates in cycle 1.
    Run: inrun simulate -f simulate-accept.yaml (builds the CR from intent:, as serve play does)
spec:
  blueprint: ../blueprint.yaml
  crd: ../crd.yaml
  setup:
    - ../setup.yaml
  intent: ./primary.yaml
  token: console
  cycles: 5
  skipExternal: true
  expect:
    steady: true
    steadyAt: 2
    noErrors: true
    ops:
      - cycle: 1
        verb: patch
        resource: finalizers
      - cycle: 1
        verb: patch
        resource: status
