apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: intent-accept
  description: >
    Asserts that a play-built PlatformResource CR reaches steady state at cycle 2
    and produces the expected finalizer and status updates in cycle 1.
    Run via: inrun serve play -f <blueprint> --token console -i primary.yaml --simulate-config simulate-accept.yaml
spec:
  blueprint: ../blueprint.yaml
  cr: ""
  cycles: 5
  skipExternal: true
  expect:
    steady: true
    steadyAt: 2
    noErrors: true
    ops:
      - cycle: 1
        verb: patch
        resource: finalizers
      - cycle: 1
        verb: patch
        resource: status
