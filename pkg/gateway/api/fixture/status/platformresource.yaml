# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/status.json
# Status field projections for the gateway serve fixture.
fields:
  - path: workloadType
    value: "{{ .spec.workloadType }}"
  - path: team
    value: "{{ .spec.team }}"
  - path: environment
    value: "{{ .spec.environment }}"
  - path: phase
    value: "Ready"
