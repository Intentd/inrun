# yaml-language-server: $schema=https://inrun.dev/schema/v1/e2e.json
# https://inrun.dev/docs/reference/schema/e2e/
apiVersion: inrun.dev/v1
kind: E2E
metadata:
  name: gateway-serve-fixture-e2e
  description: >
    End-to-end test for the gateway serve fixture.
    Exercises: Gateway API (app workload), conditional admission rules
    (deny when, deny or, warn when), dryRun violation response,
    service-list endpoint.

spec:
  blueprint: ./blueprint.yaml
  crd: ./crd.yaml
  cr: ./cr-default.yaml

  # The console token setup.yaml stores in fixture-console-token.
  env:
    FIXTURE_CONSOLE_TOKEN: fixture-console-e2e

  prepare:
    apply:
      - path: ./setup.yaml
        wait:
          - kind: Namespace
            name: team-payments
            timeout: 10s
          - kind: Namespace
            name: team-platform
            timeout: 10s
    helm:
      - include: ./include/helm/argo-cd.yaml
      - include: ./include/helm/cert-manager.yaml
      - include: ./include/helm/kube-prometheus-stack.yaml

  expect:
    - name: The admission webhook is registered
      timeout: 60s
      onFailure:
        stop: true
      resources:
        - kind: Deployment
          name: inrun-gateway
          namespace: inrun-system
          ready: true
        - kind: ValidatingWebhookConfiguration
          name: inrun-admission-validation

    - include: ./include/happy-path.yaml
    - include: ./include/admission.yaml
    - include: ./include/appgroup.yaml
    - include: ./include/clusterpolicy.yaml
    - include: ./include/gateway.yaml
    - include: ./include/deletion.yaml

  onFailure:
    kubectl:
      logs:
        - leaderElection:
            lease: inrun-leader
          namespace: inrun-system
          since: 5m
        - labelSelector: app.kubernetes.io/component=gateway
          namespace: inrun-system
          since: 5m
      describe:
        - kind: PlatformResource
          name: payments-api
          namespace: team-payments
      events:
        - kind: PlatformResource
          name: payments-api
          namespace: team-payments
