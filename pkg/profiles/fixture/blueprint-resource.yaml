apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: profile-probe-resource
  author: intentd
  version: 0.1.0
  description: >
    ProfileProbe — living integration test for resource profiles.
    Creates one Deployment per profile. Inspect each Deployment's
    resource requests/limits to verify expansion.
    kubectl get deployment -l inrun.dev/managed-by=my-probe -o yaml

spec:
  crds:
    profile-probe-resource:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          default: true
          workers: 1
          resync: 30s
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-tiny"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: tiny
                reconcile: true

              - name: "{{ .metadata.name }}-small"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: small
                reconcile: true

              - name: "{{ .metadata.name }}-medium"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: medium
                reconcile: true

              - name: "{{ .metadata.name }}-large"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: large
                reconcile: true

              - name: "{{ .metadata.name }}-burst"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: burst
                reconcile: true

              - name: "{{ .metadata.name }}-steady"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: steady
                reconcile: true

              - name: "{{ .metadata.name }}-compute-heavy"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: compute-heavy
                reconcile: true

              - name: "{{ .metadata.name }}-memory-heavy"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                resources:
                  profile: memory-heavy
                reconcile: true
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    notExists: true

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployments.my-probe-medium }}"
                    equals: "true"

