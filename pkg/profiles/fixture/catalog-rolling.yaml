apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: profile-probe-rolling
  author: intentd
  version: 0.1.0
  description: >
    ProfileProbe — living integration test for rolling update strategy profiles.
    One CRD deploys three Deployments, each using a different rollingUpdate profile.
    The profile expands at catalog load time into maxSurge and maxUnavailable.
    Trigger a Deployment update (e.g. change the CR's image field) and watch the
    rollout behavior differ across profiles.

spec:
  crds:
    profile-probe-rolling:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-safe"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "3"
                reconcile: true
                rollingUpdate:
                  profile: safe

              - name: "{{ .metadata.name }}-fast"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "3"
                reconcile: true
                rollingUpdate:
                  profile: fast

              - name: "{{ .metadata.name }}-bg"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "2"
                reconcile: true
                rollingUpdate:
                  profile: blue-green
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    notExists: true

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

