# yaml-language-server: $schema=https://inrun.dev/schema/v1/e2e.json
apiVersion: inrun.dev/v1
kind: E2E
metadata:
  name: http-auth-e2e
  description: >
    Verifies auth.secretRef on external calls. The config call hits
    /protected/:name which requires Bearer dev-token-abc123. The token is
    read from a Kubernetes Secret. status.tokenValid proves the credential
    was resolved and accepted. Patching the Secret to a wrong token drives
    configStatus to 401 on the next reconcile.

spec:
  blueprint: ./blueprint.yaml
  crd: ./crd.yaml
  cr: ./e2e-cr.yaml

  cluster:
    provider: kind
    name: inrun-http-auth
    reuse: false

  expect:
    - name: The dev server is running (run with --dev-server)
      timeout: 30s
      onFailure:
        stop: true
      resources:
        - kind: Deployment
          name: inrun-dev-server
          namespace: inrun-system
          ready: true

    - include: ./include/01-setup.yaml
    - include: ./include/02-wrong-token.yaml
    - include: ./include/03-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: WebApp
          namespace: default
      logs:
        - leaderElection:
            lease: inrun-leader
            namespace: inrun-system
          since: 2m
