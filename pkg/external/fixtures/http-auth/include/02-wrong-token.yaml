# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
expect:
  - name: patch Secret with wrong token
    timeout: 30s
    kubectl:
      apply:
        - inline: |
            apiVersion: v1
            kind: Secret
            metadata:
              name: dev-server-token
              namespace: default
            type: Opaque
            stringData:
              token: wrong-token

  - name: configStatus becomes 401 after wrong token
    timeout: 60s
    kubectl:
      get:
        - kind: WebApp
          name: my-app
          namespace: default
          field: .status.configStatus
          assert:
            equals: "401"
