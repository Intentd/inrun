# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/e2e-expect.json
expect:
  - name: phase is Ready — Redis PING succeeded
    after: cr-applied
    timeout: 90s
    kubectl:
      get:
        - kind: WebApp
          name: my-app
          namespace: default
          field: .status.phase
          assert:
            equals: "Ready"

  - name: pingResult is PONG
    after: cr-applied
    timeout: 90s
    kubectl:
      get:
        - kind: WebApp
          name: my-app
          namespace: default
          field: .status.pingResult
          assert:
            equals: "PONG"

  - name: dbSize is set
    after: cr-applied
    timeout: 90s
    kubectl:
      get:
        - kind: WebApp
          name: my-app
          namespace: default
          field: .status.dbSize
          assert:
            exists: true
