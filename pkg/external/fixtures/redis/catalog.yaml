apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: external-redis
  description: >
    Verifies protocol: redis using a Redis instance whose URL is read from
    spec.redisURL. PING asserts connectivity; DBSIZE shows key count.

spec:
  crds:
    webapp:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          resync: 20s

          onReconcile:
            external:
              - name: ping
                protocol: redis
                url: "{{ .spec.redisURL }}"
                query: "PING"
                continueOnError: true
                timeout: 5s

              - name: dbSize
                protocol: redis
                url: "{{ .spec.redisURL }}"
                query: "DBSIZE"
                continueOnError: true
                timeout: 5s
                cacheFor: 10s

            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: 1
        emit:
          status:
            fields:
              - path: pingResult
                value: "{{ .external.ping.result }}"

              - path: dbSize
                value: "{{ .external.dbSize.result }}"

              - path: phase
                value: "Ready"
                when:
                  - field: external.ping.result
                    equals: "PONG"

              - path: phase
                value: "Degraded"
                when:
                  - field: external.ping.error
                    exists: true

