# yaml-language-server: $schema=https://inrun.dev/schema/v1/e2e.json
apiVersion: inrun.dev/v1
kind: E2E
metadata:
  name: external-redis-e2e
  description: >
    Verifies protocol: redis by deploying a Redis instance in inrun-system
    and querying it from the WebApp reconciler. PING asserts connectivity;
    DBSIZE asserts the result field is set.

spec:
  blueprint: ./blueprint.yaml
  crd: ./crd.yaml
  cr: ./e2e/cr-e2e.yaml

  cluster:
    provider: kind
    name: inrun-external-redis
    reuse: false

  expect:
    - include: ./e2e/01-redis-deploy.yaml
    - include: ./e2e/02-assertions.yaml
    - include: ./e2e/03-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: WebApp
          namespace: default
      logs:
        - leaderElection:
            lease: inrun-leader
            namespace: inrun-system
          since: 2m
