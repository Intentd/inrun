expect:
  - name: phase is Ready — postgres query succeeded
    after: cr-applied
    timeout: 90s
    kubectl:
      get:
        - kind: WebApp
          name: my-app
          namespace: default
          field: .status.phase
          equals: "Ready"

  - name: currentDatabase is inrun
    after: cr-applied
    timeout: 90s
    kubectl:
      get:
        - kind: WebApp
          name: my-app
          namespace: default
          field: .status.currentDatabase
          equals: "inrun"

  - name: connectionCount is set
    after: cr-applied
    timeout: 90s
    kubectl:
      get:
        - kind: WebApp
          name: my-app
          namespace: default
          field: .status.connectionCount
          exists: true
