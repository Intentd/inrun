apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: external-mongo
  description: >
    Verifies protocol: mongo using a MongoDB instance deployed in inrun-system.
    Queries the inrun.test collection to assert connectivity and document count.

spec:
  crds:
    webapp:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          resync: 20s

          onReconcile:
            external:
              - name: docs
                protocol: mongo
                url: "{{ .spec.mongoURL }}"
                query: "inrun.test"
                continueOnError: true
                timeout: 5s

              - name: activeConnections
                protocol: mongo
                url: "{{ .spec.mongoURL }}"
                query: 'inrun.test {"status": "active"}'
                continueOnError: true
                timeout: 5s
                cacheFor: 10s

            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: 1
        emit:
          status:
            fields:
              - path: docCount
                value: "{{ .external.docs.count }}"

              - path: activeCount
                value: "{{ .external.activeConnections.count }}"

              - path: phase
                value: "Ready"
                when:
                  - field: external.docs.error
                    notExists: true

              - path: phase
                value: "Degraded"
                when:
                  - field: external.docs.error
                    exists: true

