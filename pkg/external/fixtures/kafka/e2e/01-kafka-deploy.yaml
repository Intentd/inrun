expect:
  - name: deploy Kafka in inrun-system
    kubectl:
      apply:
        - inline: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: kafka
              namespace: inrun-system
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: kafka
              template:
                metadata:
                  labels:
                    app: kafka
                spec:
                  containers:
                    - name: kafka
                      image: apache/kafka:3.9.0
                      ports:
                        - containerPort: 9092
                      env:
                        - name: KAFKA_NODE_ID
                          value: "1"
                        - name: KAFKA_PROCESS_ROLES
                          value: broker,controller
                        - name: KAFKA_LISTENERS
                          value: PLAINTEXT://:9092,CONTROLLER://:9093
                        - name: KAFKA_ADVERTISED_LISTENERS
                          value: PLAINTEXT://kafka.inrun-system.svc:9092
                        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
                          value: 1@localhost:9093
                        - name: KAFKA_CONTROLLER_LISTENER_NAMES
                          value: CONTROLLER
                        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
                          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
                        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
                          value: "1"
                        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
                          value: "false"
        - inline: |
            apiVersion: v1
            kind: Service
            metadata:
              name: kafka
              namespace: inrun-system
            spec:
              selector:
                app: kafka
              ports:
                - port: 9092
                  targetPort: 9092

  - name: Kafka pod is Available
    timeout: 120s
    resources:
      - kind: Deployment
        name: kafka
        namespace: inrun-system
        condition: Available

  - name: create events topic (3 partitions)
    kubectl:
      apply:
        - inline: |
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: kafka-init
              namespace: inrun-system
            spec:
              ttlSecondsAfterFinished: 60
              template:
                spec:
                  restartPolicy: OnFailure
                  containers:
                    - name: kafka-init
                      image: apache/kafka:3.9.0
                      command:
                        - /opt/kafka/bin/kafka-topics.sh
                        - --bootstrap-server
                        - kafka.inrun-system.svc:9092
                        - --create
                        - --topic
                        - events
                        - --partitions
                        - "3"
                        - --replication-factor
                        - "1"
                        - --if-not-exists

  - name: kafka-init job complete
    timeout: 60s
    resources:
      - kind: Job
        name: kafka-init
        namespace: inrun-system
        condition: Complete

  - name: Kafka pod is Ready
    timeout: 120s
    resources:
      - kind: Deployment
        name: kafka
        namespace: inrun-system
        ready: true
