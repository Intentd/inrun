apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: registry-pack-probe
  version: v0.1.0
  description: Minimal fixture for typed annotations and deprecation detection
lifecycle:
  deprecation:
    migratedTo: ghcr.io/intentd/registry/registry-pack-probe:v0.2.0
    message: "Upgrade to v0.2.0"

spec:
  crds:
    probe:
      operatorBox:
        reconcile:
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-probe"
                image: "busybox:latest"
                replicas: "1"

