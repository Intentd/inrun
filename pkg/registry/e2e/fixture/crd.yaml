apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: e2eprobes.e2e.inrun.dev
spec:
  group: e2e.inrun.dev
  names:
    kind: E2EProbe
    plural: e2eprobes
    singular: e2eprobe
  scope: Namespaced

  versions:
    - name: v1alpha1
      served: true
      storage: true

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Container image for the probe deployment
                replicas:
                  type: integer
                  default: 2
                  description: Number of desired replicas
                port:
                  type: integer
                  default: 80
                  description: Port exposed by the container
                message:
                  type: string
                  default: "hello"
                  description: Message surfaced to status — used by exec and get assertions
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
