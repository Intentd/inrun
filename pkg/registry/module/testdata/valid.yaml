# yaml-language-server: $schema=https://inrun.dev/schema/v1/module.json
apiVersion: inrun.dev/v1
kind: Module
metadata:
  name: test-db
  version: v1
  description: Test database module

inputs:
  - name: image
    required: true
    description: Container image

  - name: volumeSize
    default: "5Gi"
    description: PVC size

resources:
  statefulSets:
    - name: "{{ .metadata.name }}-db"
      image: "{{ index .inputs \"image\" }}"
      replicas: "1"
      volumeClaimTemplates:
        - name: data
          storageSize: "{{ index .inputs \"volumeSize\" }}"
          storageClass: standard
          mountPath: /data
