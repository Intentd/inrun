apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: remote-auth-test
  version: 0.1.0
  description: Validates remote reconciler auth.secretRef with namespace set.
spec:
  crds:
    widget:
      crdFile: ../../../testdata/validate/crd.yaml
      operatorBox:
        reconcile:
          default: false
          managedResources:
            - group: apps
              plural: deployments
          remote:
            endpoint: "http://localhost:8025/reconcile"
            auth:
              secretRef:
                name: reconciler-token
                namespace: default
                key: token
