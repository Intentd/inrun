# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: remote-auth-no-ns-test
  version: 0.1.0
  description: Validates that missing secretRef.namespace produces a warning.
spec:
  crds:
    widget:
      crdFile: ../../../testdata/validate/crd.yaml
      operatorBox:
        reconcile:
          default: false
          remote:
            endpoint: "http://localhost:8025/reconcile"
            auth:
              secretRef:
                name: reconciler-token
                key: token
