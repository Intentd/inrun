# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: appcert-operator
spec:
  crds:
    appcert:
      apiTypes:
        group: demo.inrun.dev
        version: v1alpha1
        kind: AppCert
        plural: appcerts
      operatorBox:
        reconcile:
          onCreate:
            custom:
            - apiVersion: cert-manager.io/v1
              kind: Issuer
              metadata:
                name: "{{ .metadata.name }}-issuer"
                namespace: "{{ .metadata.namespace }}"
              spec:
                selfSigned: {}
            - apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: "{{ .metadata.name }}-cert"
                namespace: "{{ .metadata.namespace }}"
              spec:
                secretName: "{{ .metadata.name }}-tls"

