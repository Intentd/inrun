apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: publish-signing-valid
  version: 1.0.0
  description: Valid publish block with signing policy.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
publish:
  signing:
    verify: true
    expectedIdentities:
      - github.com/myorg/myrepo/.github/workflows/release.yaml@refs/heads/main
