# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: gateway-clusters-kubeconfig
  version: 1.0.0
  description: Valid gateway.clusters with kubeconfig (secretRef) credential form.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
gateway:
  enabled: true
  clusters:
    prod:
      endpoint: https://prod.internal:6443
      secretRef:
        name: prod-cluster-credentials
        key: kubeconfig
    staging:
      endpoint: https://staging.internal:6443
      secretRef:
        name: staging-cluster-credentials
        key: kubeconfig
