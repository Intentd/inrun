# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: requeue-after-duration
  version: 0.1.0
  description: Valid requeue.after with a plain duration string.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      operatorBox:
        reconcile:
          requeue:
            after: "30s"
