# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: watch-entries
  version: 0.1.0
  description: Valid operatorBox.observe.watch and preReconcile.sentinels.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      operatorBox:
        preReconcile:
          sentinels:
            - generationChanged
            - labelsChanged
        observe:
          watch:
            - apiVersion: apps/v1
              kind: Deployment
            - apiVersion: v1
              kind: Node
              on: [update]

