# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: gateway-clusters-token
  version: 1.0.0
  description: Valid gateway.clusters with bearer token + CA cert credential form.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
gateway:
  enabled: true
  clusters:
    prod:
      endpoint: https://prod.internal:6443
      tokenRef:
        name: prod-sa-token
        key: token
      caRef:
        name: prod-ca
        key: ca.crt
