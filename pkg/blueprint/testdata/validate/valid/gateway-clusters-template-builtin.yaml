apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: gateway-clusters-template-builtin
  version: 1.0.0
  description: Valid serve.clusters and target.clusters templates using only Go builtins.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      serve:
        enabled: true
        namespace: default
        clusters:
          - '{{ if eq .intent.env "prod" }}prod{{ else }}staging{{ end }}'
        target:
          primary:
            primary: true
            clusters:
              - '{{ if eq .intent.region "us-east" }}prod{{ else }}staging{{ end }}'
gateway:
  enabled: true
  api:
    enabled: true
  clusters:
    prod:
      endpoint: https://prod.internal:6443
      secretRef:
        name: prod-credentials
        key: kubeconfig
    staging:
      endpoint: https://staging.internal:6443
      secretRef:
        name: staging-credentials
        key: kubeconfig
