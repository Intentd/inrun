apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: gateway-clusters-fanout
  version: 1.0.0
  description: Valid serve.clusters fan-out — all targets absent, defaults to all of serve.clusters.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      serve:
        enabled: true
        namespace: default
        clusters:
          - prod
          - staging
          - eu-west
gateway:
  enabled: true
  api:
    enabled: true
  clusters:
    prod:
      endpoint: https://prod.internal:6443
      secretRef:
        name: prod-credentials
        key: kubeconfig
    staging:
      endpoint: https://staging.internal:6443
      secretRef:
        name: staging-credentials
        key: kubeconfig
    eu-west:
      endpoint: https://eu-west.internal:6443
      secretRef:
        name: eu-west-credentials
        key: kubeconfig
