# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: bad-gateway-cluster-target-not-in-serve
  version: 1.0.0
  description: Tests that target.clusters entries not declared in serve.clusters fail validation.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      serve:
        enabled: true
        namespace: default
        clusters:
          - prod          # only prod declared
        target:
          primary:
            primary: true
            clusters:
              - staging   # staging is in gateway.clusters but NOT in serve.clusters → error
gateway:
  enabled: true
  api:
    enabled: true
  clusters:
    prod:
      endpoint: https://prod.internal:6443
      secretRef:
        name: prod-credentials
        key: kubeconfig
    staging:
      endpoint: https://staging.internal:6443
      secretRef:
        name: staging-credentials
        key: kubeconfig
