# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: bad-gateway-cluster-mixed-creds
  version: 1.0.0
  description: Tests that declaring both secretRef and tokenRef on a cluster fails validation.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
gateway:
  enabled: true
  clusters:
    prod:
      endpoint: https://prod.internal:6443
      secretRef:
        name: prod-kubeconfig
        key: kubeconfig
      tokenRef:
        name: prod-sa-token
        key: token
