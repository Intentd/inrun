# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
# Triggers: watch entry with unknown on: value
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: bad-watch-unknown-on
  version: 0.1.0
  description: >
    watch entry declares an unrecognised on: value.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      operatorBox:
        observe:
          watch:
            - apiVersion: apps/v1
              kind: Deployment
              on: [modified]

