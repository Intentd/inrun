# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: bad-retry-backoff-negative-multiplier
  version: 0.1.0
  description: Invalid retryBackoff — negative multiplier.
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      operatorBox:
        reconcile:
          queue:
            retryBackoff:
              initial: 500ms
              multiplier: -1.0
