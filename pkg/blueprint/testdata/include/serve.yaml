# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: test
gateway:
  api:
    enabled: true
    auth:
      tokens:
        - name: cc
          secretRef:
            name: inrun-apply-token
            key: token
spec:
  crds:
    platform:
      apiTypes:
        group: platform.inrun.dev
        version: v1alpha1
        kind: Platform
        plural: platforms
      serve:
        enabled: true
        include: ./serve-fields.yaml
        fields:
          image:
            label: "Image"
            order: 3
