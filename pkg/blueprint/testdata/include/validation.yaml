# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: test
spec:
  crds:
    platform:
      apiTypes:
        group: platform.inrun.dev
        version: v1alpha1
        kind: Platform
        plural: platforms
      admission:
        validation:
          include: ./validation-rules.yaml
          rules:
            - field: spec.replicas
              max: "10"
              message: "replicas must not exceed 10"
              action: deny

