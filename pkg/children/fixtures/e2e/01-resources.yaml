expect:
  - name: All forEach-expanded resources created
    after: cr-applied
    timeout: 120s
    resources:
      - kind: Tenant
        name: acme

      # ── Namespaced (forEach spec.namespaces) ──────────────────────────────
      - kind: Namespace
        name: acme-dev
      - kind: Namespace
        name: acme-staging

      - kind: NetworkPolicy
        name: acme-acme-dev-deny-all
        namespace: acme-dev
      - kind: NetworkPolicy
        name: acme-acme-staging-deny-all
        namespace: acme-staging

      - kind: ResourceQuota
        name: acme-acme-dev-quota
        namespace: acme-dev
      - kind: ResourceQuota
        name: acme-acme-staging-quota
        namespace: acme-staging

      - kind: LimitRange
        name: acme-acme-dev-limits
        namespace: acme-dev
      - kind: LimitRange
        name: acme-acme-staging-limits
        namespace: acme-staging

      # ── RBAC (ClusterRole/CRB forEach spec.roles; rest forEach spec.namespaces) ──
      - kind: ClusterRole
        name: acme-developer
      - kind: ClusterRole
        name: acme-reviewer

      - kind: ClusterRoleBinding
        name: acme-developer-binding
      - kind: ClusterRoleBinding
        name: acme-reviewer-binding

      - kind: ServiceAccount
        name: acme-acme-dev-sa
        namespace: acme-dev
      - kind: ServiceAccount
        name: acme-acme-staging-sa
        namespace: acme-staging

      - kind: Role
        name: acme-acme-dev-role
        namespace: acme-dev
      - kind: Role
        name: acme-acme-staging-role
        namespace: acme-staging

      - kind: RoleBinding
        name: acme-acme-dev-rolebinding
        namespace: acme-dev
      - kind: RoleBinding
        name: acme-acme-staging-rolebinding
        namespace: acme-staging

      # ── Workloads (forEach spec.apps) ─────────────────────────────────────
      - kind: Deployment
        name: acme-api
        namespace: default
      - kind: Deployment
        name: acme-worker
        namespace: default

      - kind: StatefulSet
        name: acme-api-sts
        namespace: default
      - kind: StatefulSet
        name: acme-worker-sts
        namespace: default

      - kind: ReplicaSet
        name: acme-api-rs
        namespace: default
      - kind: ReplicaSet
        name: acme-worker-rs
        namespace: default

      - kind: Pod
        name: acme-api-pod
        namespace: default
      - kind: Pod
        name: acme-worker-pod
        namespace: default

      - kind: Job
        name: acme-api-job
        namespace: default
      - kind: Job
        name: acme-worker-job
        namespace: default

      - kind: CronJob
        name: acme-api-cron
        namespace: default
      - kind: CronJob
        name: acme-worker-cron
        namespace: default

      # ── Network (forEach spec.apps) ────────────────────────────────────────
      - kind: Service
        name: acme-api-svc
        namespace: default
      - kind: Service
        name: acme-worker-svc
        namespace: default

      - kind: Ingress
        name: acme-api-ingress
        namespace: default
      - kind: Ingress
        name: acme-worker-ingress
        namespace: default

      - kind: HorizontalPodAutoscaler
        name: acme-api-hpa
        namespace: default
      - kind: HorizontalPodAutoscaler
        name: acme-worker-hpa
        namespace: default

      - kind: PodDisruptionBudget
        name: acme-api-pdb
        namespace: default
      - kind: PodDisruptionBudget
        name: acme-worker-pdb
        namespace: default

      # ── Config (forEach spec.namespaces) ──────────────────────────────────
      - kind: ConfigMap
        name: acme-acme-dev-config
        namespace: acme-dev
      - kind: ConfigMap
        name: acme-acme-staging-config
        namespace: acme-staging

      - kind: Secret
        name: acme-acme-dev-secret
        namespace: acme-dev
      - kind: Secret
        name: acme-acme-staging-secret
        namespace: acme-staging

      # ── Storage ────────────────────────────────────────────────────────────
      - kind: PersistentVolume
        name: acme-api-pv
      - kind: PersistentVolume
        name: acme-worker-pv

      - kind: PersistentVolumeClaim
        name: acme-acme-dev-pvc
        namespace: acme-dev
      - kind: PersistentVolumeClaim
        name: acme-acme-staging-pvc
        namespace: acme-staging

      # ── Custom Child (TenantPlan + its operator output) ───────────────────
      - kind: TenantPlan
        name: acme-plan
      - kind: ConfigMap
        name: acme-plan-config
        namespace: default
