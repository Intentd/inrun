expect:
  - name: All resources removed on delete
    after: cr-deleted
    timeout: 120s
    resources:
      - kind: Tenant
        name: acme
        count: 0

      # ── Cluster-scoped ────────────────────────────────────────────────────
      - kind: Namespace
        name: acme-dev
        count: 0
      - kind: Namespace
        name: acme-staging
        count: 0

      - kind: ClusterRole
        name: acme-developer
        count: 0
      - kind: ClusterRole
        name: acme-reviewer
        count: 0

      - kind: ClusterRoleBinding
        name: acme-developer-binding
        count: 0
      - kind: ClusterRoleBinding
        name: acme-reviewer-binding
        count: 0

      - kind: PersistentVolume
        name: acme-api-pv
        count: 0
      - kind: PersistentVolume
        name: acme-worker-pv
        count: 0

      - kind: TenantPlan
        name: acme-plan
        count: 0

      # ── default namespace (workloads / network) ───────────────────────────
      - kind: Deployment
        name: acme-api
        namespace: default
        count: 0
      - kind: Deployment
        name: acme-worker
        namespace: default
        count: 0

      - kind: StatefulSet
