# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/simulate-ops-rule.json
ops:
  # DEV Environment
  - cycle: 1
    verb: apply
    resource: configmaps
    name: acme-acme-dev-config
  - cycle: 1
    verb: apply
    resource: secrets
    name: acme-acme-dev-secret
  
  # STAGING Environment
  - cycle: 1
    verb: apply
    resource: configmaps
    name: acme-acme-staging-config
  - cycle: 1
    verb: apply
    resource: secrets
    name: acme-acme-staging-secret