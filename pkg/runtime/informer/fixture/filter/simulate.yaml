# yaml-language-server: $schema=https://inrun.dev/schema/v1/simulate.json
apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: filter-probe-simulate
  description: >
    Runs both filter scenarios: spec.active true produces a ConfigMap;
    spec.active false is dropped by the enqueue filter — nothing created.

imports:
  - simulate/active.yaml
  - simulate/inactive.yaml
