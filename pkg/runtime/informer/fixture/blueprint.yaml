apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: informer-probe
  author: intentd
  version: 0.1.0
  description: >
    Living fixture for pkg/informer. A minimal declarative operator used to
    verify that the informer factory correctly watches a CRD, syncs the cache,
    and triggers reconciles. e2e assertions use /blueprint/informer-probe/health
    and /blueprint/informer-probe/cr via leader port-forward.

spec:
  crds:
    informer-probe:
      apiTypes:
        group: informer.inrun.dev
        version: v1alpha1
        kind: InformerProbe
        plural: informerprobes
      operatorBox:
        reconcile:
          workers: 2
          resync: 10s
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-config"
                namespace: "{{ .metadata.namespace }}"
                data:
                  observed: "{{ .metadata.name }}"
        runtime:
          allowedNamespaces:
            - team-a
        emit:
          status:
            fields:
              - path: phase
                value: Running
              - path: observed
                value: "{{ .metadata.name }}"

