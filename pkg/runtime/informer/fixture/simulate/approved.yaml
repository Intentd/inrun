# yaml-language-server: $schema=https://inrun.dev/schema/v1/simulate.json
apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: informer-probe-approved
  description: CR in allowed namespace (team-a) — reconciler runs, ConfigMap created

spec:
  blueprint: ../blueprint.yaml
  crd: ../crd.yaml
  cr: ../cr.yaml
  setup:
    - ../setup.yaml
  cycles: 2

  expect:
    steady: true
    noErrors: true
    crds:
      informer-probe:
        ops:
          - cycle: 1
            verb: create
            resource: configmaps
            name: probe-allowed-config
