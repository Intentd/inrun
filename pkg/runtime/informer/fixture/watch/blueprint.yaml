# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: watch-probe
  author: intentd
  version: 0.1.0
  description: >
    Living fixture for operatorBox.observe.watch. A WatchProbe CR watches a shared
    ConfigMap it does not own. When the ConfigMap changes, the WatchProbe is
    re-enqueued and reconciles — no ownerReference required. Key resolution
    uses keyFrom.name (singleton pattern).

spec:
  crds:
    watch-probe:
      labels:
        watchprobe-tester: "{{ .metadata.name }}"
      crdFile: crd.yaml
      crFiles:
        - cr.yaml
      setup:
        - configmap-shared.yaml
      operatorBox:
        reconcile:
          resync: 30s
          onReconcile:
            configMaps:
              - name: "{{ .metadata.name }}-output"
                namespace: "{{ .metadata.namespace }}"
                reconcile: true
                data:
                  observed: "{{ .metadata.name }}"
                  phase: active
        observe:
          watch:
            - apiVersion: v1
              kind: ConfigMap
              name: shared-config
              namespace: default
              on: [update]
              keyFrom:
                name: probe-alpha
                namespace: default
        emit:
          status:
            fields:
              - path: phase
                value: Watching

