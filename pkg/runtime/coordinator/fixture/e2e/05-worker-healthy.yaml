expect:
  # Worker reconciles → healthy. Platform gate (healthy) opens → Platform healthy.
  - name: Worker CR applied — Worker healthy, Platform gate opens and reaches healthy
    after: cr-applied
    timeout: 90s
    kubectl:
      apply:
        - file: ./cr-worker.yaml
      get:
        - kind: Worker
          name: core-worker
          namespace: default
          field: .status.phase
          equals: Running
        - kind: Platform
          name: main-platform
          namespace: default
          field: .status.phase
          equals: Running
      port-forward:
        - leaderElection:
            lease: inrun-leader
            namespace: inrun-system
          port: 8080
          path: /blueprint/worker/health
          jq: .state
          equals: healthy
        - leaderElection:
            lease: inrun-leader
            namespace: inrun-system
          port: 8080
          path: /blueprint/platform/health
          jq: .state
          equals: healthy
        - leaderElection:
            lease: inrun-leader
            namespace: inrun-system
          port: 8080
          path: /blueprint/platform/health
          jq: .hasUnhealthyDependencies
          equals: "false"
        - leaderElection:
            lease: inrun-leader
            namespace: inrun-system
          port: 8080
          path: /blueprint/platform/health
          jq: .totalReconciles
          greaterThan: 0
