# yaml-language-server: $schema=https://inrun.dev/schema/v1/module.json
apiVersion: inrun.dev/v1
kind: Module
metadata:
  name: reconciler-probe-core
  description: Core resources — Namespace and ConfigMap with spec-driven data.

resources:
  onCreate:
    namespaces:
      - name: "{{ .metadata.name }}-ns"

  configMaps:
    - name: "{{ .metadata.name }}-config"
      namespace: "{{ .metadata.name }}-ns"
      data:
        PORT: "{{ .spec.port }}"
        TIER: "{{ .spec.tier }}"
        IMAGE: "{{ .spec.image }}"
