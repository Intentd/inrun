apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: webapp-validation-external
  description: >
    Demonstrates validation.external with two calls at different lifecycle
    points. healthCheck fires only at first admission (fires.reconcile: false)
    — its rule is skipped on every resync. configFetch has no restriction and
    runs on every reconcile, driving phase and status fields.

spec:
  crds:
    webapp:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      admission:
        validation:
          external:
            - name: healthCheck
              url: "{{ .spec.healthCheckUrl }}"
              method: GET
              expectedStatus: [200]
              continueOnError: true
              timeout: 5s
              fires:
                reconcile: false   # admission-only — not re-run on resyncs

            - name: configFetch
              url: "http://inrun-dev-server.inrun-system.svc:9999/health"
              continueOnError: true
              timeout: 5s
              # no fires: — runs at both admission and reconcile

          rules:
          # Only active at admission time. when: guards on called == "true" —
          # at reconcile, healthCheck is skipped so called is "" and this
          # rule is never evaluated.
          - field: "{{ .external.healthCheck.status }}"
            equals: "200"
            action: deny
            message: "service health check failed — {{ .spec.healthCheckUrl }} must return 200 before deployment is allowed"
            when:
              - field: external.healthCheck.called
                equals: "true"

          # Always evaluated — configFetch runs at both admission and reconcile.
          - field: "{{ .external.configFetch.status }}"
            equals: "200"
            action: deny
            message: "config service unreachable"
      operatorBox:
        reconcile:
          workers: 2
          resync: 30s

          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                namespace: "{{ .metadata.namespace }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Active"
                when:
                  - field: external.configFetch.status
                    equals: "200"

              - path: phase
                value: "Degraded"
                when:
                  - field: external.configFetch.called
                    equals: "true"
                  - field: external.configFetch.status
                    notEquals: "200"

              - path: configFetchStatus
                value: "{{ .external.configFetch.status }}"

              - path: lastExternalError
                value: "{{ .external.healthCheck.error }}"
                clearOnFalse: true
                when:
                  - field: external.healthCheck.called
                    equals: "true"
                  - field: external.healthCheck.error
                    exists: true

              - path: admissionOnlyRan
                value: "true"
                when:
                  - field: external.healthCheck.called
                    equals: "true"

              - path: approvedMessage
                value: "deployment approved"

