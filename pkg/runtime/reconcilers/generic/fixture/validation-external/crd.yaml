apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.demo.inrun.dev
spec:
  group: demo.inrun.dev
  scope: Namespaced
  names:
    plural: webapps
    singular: webapp
    kind: WebApp
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                healthCheckUrl:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
