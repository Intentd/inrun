ops:
  # Workload Controllers
  - cycle: 1
    verb: apply
    resource: replicasets
    name: probe-rs
  - cycle: 1
    verb: apply
    resource: deployments
    name: probe-app
  - cycle: 1
    verb: apply
    resource: deployments
    name: probe-premium
  - cycle: 1
    verb: apply
    resource: statefulsets
    name: probe-sts
  
  # Batch Jobs
  - cycle: 1
    verb: create
    resource: jobs
    name: probe-init
  - cycle: 1
    verb: apply
    resource: cronjobs
    name: probe-cron
  
  # Pods
  - cycle: 1
    verb: apply
    resource: pods
    name: probe-pod
  
  # Networking
  - cycle: 1
    verb: apply
    resource: services
    name: probe-svc
  - cycle: 1
    verb: apply
    resource: ingresses
    name: probe-ing
  
  # Storage
  - cycle: 1
    verb: apply
    resource: persistentvolumes
    name: probe-pv
  - cycle: 1
    verb: create
    resource: persistentvolumeclaims
    name: probe-pvc
  
  # Autoscaling & Resilience
  - cycle: 1
    verb: apply
    resource: horizontalpodautoscalers
    name: probe-hpa
  - cycle: 1
    verb: apply
    resource: poddisruptionbudgets
    name: probe-pdb