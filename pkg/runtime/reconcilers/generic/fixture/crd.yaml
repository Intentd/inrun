apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reconcilerprobes.reconciler.inrun.dev
spec:
  group: reconciler.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Tier
          type: string
          jsonPath: .status.tier
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                port:
                  type: integer
                tier:
                  type: string
                  enum: [basic, premium]
                schedule:
                  type: string
                extraLabels:
                  type: array
                  items:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  scope: Cluster
  names:
    plural: reconcilerprobes
    singular: reconcilerprobe
    kind: ReconcilerProbe
    shortNames:
      - rp
---
