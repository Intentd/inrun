# yaml-language-server: $schema=https://inrun.dev/schema/v1/e2e.json
apiVersion: inrun.dev/v1
kind: E2E
metadata:
  name: notes-validation-e2e
  description: >
    Living fixture for user-defined notes in validation and mutation.

    Asserts that:
    - mutation defaults spec.replicas from the {{ defaultReplicas }} note
    - image validation always fires: CRs with images outside {{ allowedRegistry }} are denied
    - status conditions carry the original template expression in the field name
    - no Deployment is created for denied CRs

spec:
  blueprint: ./blueprint.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml

  functions:
    definitions:
      - name: inBusinessHours
        expression: '{{ and weekday (timeInWindow "09:00" "18:00") }}'

  cluster:
    provider: kind
    name: inrun-notes-validation
    reuse: false

  expect:
    - include: ./e2e/01-image-rule.yaml
    - include: ./e2e/02-mutation.yaml
    - include: ./e2e/03-cleanup.yaml

  onFailure:
    kubectl:
      get:
        - kind: DeploymentRequest
          name: my-app
        - kind: DeploymentRequest
          name: bad-image-app
      describe:
        - kind: Deployment
          name: my-app
          namespace: default
