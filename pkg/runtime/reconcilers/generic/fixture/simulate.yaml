# yaml-language-server: $schema=https://inrun.dev/schema/v1/simulate.json
apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: reconciler-probe-sim
  description: Verify all onCreate resources are reconciled in cycle 1 with no errors

spec:
  blueprint: ./blueprint.yaml
  crd: ./crd.yaml
  cr: ./cr.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    crds:
      reconciler-suite:
        ops:
          - cycle: 1
            verb: create
            resource: reconcilerprobes
            name: probe
      reconciler-probe:
        ops:
          - include: ./ops/01-infra.yaml
          - include: ./ops/02-rbac.yaml
          - include: ./ops/03-workloads.yaml
