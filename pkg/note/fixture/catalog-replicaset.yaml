apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: replicaset-probe
  author: intentd
  version: 0.1.0
  description: >
    ReplicaSetProbe — living integration test for ReplicaSet owner enrichment
    and Deployment replicaSets enrichment.
    enrich: [owner] embeds _owner on each ReplicaSet.
    enrich: [replicasets] embeds _replicaSets on the Deployment.
    Apply the CR and inspect: kubectl get replicasetprobe <name> -o yaml
    Reuses the NoteProbe CRD.

spec:
  crds:
    replicaset-probe:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      enrich:
        - owner
        - replicasets
        - events
      operatorBox:
        reconcile:
          workers: 1
          resync: 30s

          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-app"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              # ── Phase ───────────────────────────────────────────────────────
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    operator: notExists

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # ── enriched deployment replicasets notes ───────────────────────
              - path: replicaSetCount
                value: "{{ deploymentReplicaSetCount .children.deployment }}"
              - path: deploymentReplicaSets
                value: "{{ deploymentReplicaSets .children.deployment }}"
              - path: oldDeploymentReplicaSets
                value: "{{ oldDeploymentReplicaSets .children.deployment }}"

              # ── enriched replicaset owner notes (via synthesized .children.replicaset)
              - path: replicaSetOwnerName
                value: "{{ replicaSetOwnerName .children.replicaset }}"
              - path: replicaSetOwnerKind
                value: "{{ replicaSetOwnerKind .children.replicaset }}"

              # ── warning notes (require enrich: [events]) ────────────────────
              - path: hasWarnings
                value: "{{ hasWarnings .children.deployment }}"
              - path: warningCount
                value: "{{ warningCount .children.deployment }}"
              - path: firstWarning
                value: "{{ firstWarning .children.deployment }}"
              - path: warningMessages
                value: "{{ warningMessages .children.deployment }}"
              - path: warningReasons
                value: "{{ warningReasons .children.deployment }}"

