apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: blockchainnode-constructor-sim
  description: >
    Run with: inrun simulate --dev-server

    The dev server returns "true" for all flag requests. The constructor reads
    flagUrl from req.Args (template-resolved per CR), makes the HTTP call
    itself, and creates the Deployment at spec.replicas (5).
    This is the difference from hooks: the constructor owns the HTTP call.

spec:
  catalog: ./catalog.yaml
  cr: ./cr-node.yaml
  cycles: 3

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
        name: 02-constructor-my-node
