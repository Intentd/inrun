apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.migration.demo.inrun.dev
spec:
  group: migration.demo.inrun.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Container image to deploy.
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Desired number of pods.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 80
                  description: Container port to expose.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
  names:
    kind: WebApp
    plural: webapps
    singular: webapp
  scope: Namespaced
