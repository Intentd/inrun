apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: gateway-clusters-template-userdefined
  version: 1.0.0
  description: Valid serve.clusters template using a user-defined note function and a builtin.
notes:
  functions:
    - name: targetCluster
      description: Resolves cluster name from request context.
      expression: '{{ if eq .intent.env "prod" }}prod{{ else }}staging{{ end }}'
spec:
  crds:
    widget:
      crdFile: ../crd.yaml
      serve:
        enabled: true
        namespace: default
        clusters:
          - '{{ targetCluster }}'   # user-defined function declared in notes.functions
        target:
          primary:
            primary: true
            clusters:
              - '{{ if eq .intent.region "us" }}prod{{ else }}staging{{ end }}'
gateway:
  enabled: true
  api:
    enabled: true
  clusters:
    prod:
      endpoint: https://prod.internal:6443
      secretRef:
        name: prod-credentials
        key: kubeconfig
    staging:
      endpoint: https://staging.internal:6443
      secretRef:
        name: staging-credentials
        key: kubeconfig
