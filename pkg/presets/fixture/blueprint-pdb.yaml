# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: preset-probe-pdb
  author: intentd
  version: 0.1.0
  description: >
    PresetProbe — living integration test for PDB behavior presets.
    One CRD deploys three Deployments and three PDBs, each using a different
    behavior preset. The preset expands at blueprint load time into a concrete
    minAvailable or maxUnavailable value. Run the operator and drain a node
    to observe disruption budget enforcement per preset.

spec:
  crds:
    preset-probe-pdb:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-zero"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "3"
                reconcile: true

              - name: "{{ .metadata.name }}-rolling"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "3"
                reconcile: true

              - name: "{{ .metadata.name }}-relaxed"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                replicas: "4"
                reconcile: true

            pdb:
              - name: "{{ .metadata.name }}-zero-pdb"
                selector:
                  inrun-owner: "{{ .metadata.name }}"
                behavior:
                  preset: zero-downtime

              - name: "{{ .metadata.name }}-rolling-pdb"
                selector:
                  inrun-owner: "{{ .metadata.name }}"
                behavior:
                  preset: rolling

              - name: "{{ .metadata.name }}-relaxed-pdb"
                selector:
                  inrun-owner: "{{ .metadata.name }}"
                behavior:
                  preset: relaxed
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    notExists: true

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

