apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: presetprobebatchs.presets.inrun.dev
spec:
  group: presets.inrun.dev
  names:
    kind: PresetProbeBatch
    plural: presetprobebatchs
    singular: presetprobebatch
  scope: Namespaced

  versions:
    - name: v1alpha1
      served: true
      storage: true

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                  description: Container image used by all probe deployments
                port:
                  type: integer
                  default: 8080
                  description: Port exposed by the container
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
