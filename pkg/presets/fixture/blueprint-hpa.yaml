apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: preset-probe-hpa
  author: intentd
  version: 0.1.0
  description: >
    PresetProbe — living integration test for HPA behavior presets.
    One CRD deploys five Deployments and five HPAs, each using a different
    behavior preset. The preset expands at blueprint load time into a full
    HorizontalPodAutoscalerBehavior block. Run the operator and generate
    load to observe scale-up and scale-down behavior per preset.

spec:
  crds:
    preset-probe-hpa:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      operatorBox:
        reconcile:
          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-web"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                reconcile: true

              - name: "{{ .metadata.name }}-api"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                reconcile: true

              - name: "{{ .metadata.name }}-latency"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                reconcile: true

              - name: "{{ .metadata.name }}-batch"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                reconcile: true

              - name: "{{ .metadata.name }}-cost"
                image: "{{ .spec.image }}"
                port: "{{ .spec.port }}"
                reconcile: true

            hpa:
              - name: "{{ .metadata.name }}-web-hpa"
                scaleTargetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: "{{ .metadata.name }}-web"
                minReplicas: "1"
                maxReplicas: "10"
                behavior:
                  preset: web

              - name: "{{ .metadata.name }}-api-hpa"
                scaleTargetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: "{{ .metadata.name }}-api"
                minReplicas: "1"
                maxReplicas: "10"
                behavior:
                  preset: api

              - name: "{{ .metadata.name }}-latency-hpa"
                scaleTargetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: "{{ .metadata.name }}-latency"
                minReplicas: "2"
                maxReplicas: "20"
                behavior:
                  preset: latency-sensitive

              - name: "{{ .metadata.name }}-batch-hpa"
                scaleTargetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: "{{ .metadata.name }}-batch"
                minReplicas: "1"
                maxReplicas: "8"
                behavior:
                  preset: batch

              - name: "{{ .metadata.name }}-cost-hpa"
                scaleTargetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: "{{ .metadata.name }}-cost"
                minReplicas: "1"
                maxReplicas: "6"
                behavior:
                  preset: cost-optimized
        emit:
          status:
            fields:
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    notExists: true

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

