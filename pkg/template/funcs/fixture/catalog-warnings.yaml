apiVersion: inrun.dev/v1
kind: Catalog
metadata:
  name: warnings-probe
  author: intentd
  version: 0.1.0
  description: >
    WarningsProbe — integration test for warning event enrichment.
    Creates a Deployment that will generate warning events (deliberately
    misconfigured image) with enrich: [events].
    Apply the CR and inspect: kubectl get warningsprobe <name> -o yaml
    Reuses the NoteProbe CRD.

spec:
  crds:
    warnings-probe:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      enrich:
        - events
      operatorBox:
        reconcile:
          workers: 1
          resync: 30s

          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-app"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              # ── Phase state machine ─────────────────────────────────────────
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    notExists: true

              - path: phase
                value: "Degraded"
                when:
                  - field: "{{ hasWarnings .children.deployment._warnings }}"
                    equals: "true"
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "false"

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              # ── replica notes ───────────────────────────────────────────────
              - path: allReady
                value: "{{ allReplicasReady .children.deployment }}"

              # ── warning event notes (require enrich: [events]) ──────────────
              - path: hasWarnings
                value: "{{ hasWarnings .children.deployment._warnings }}"

              - path: warningCount
                value: "{{ warningCount .children.deployment._warnings }}"

              - path: firstWarning
                value: "{{ firstWarning .children.deployment._warnings }}"

              - path: warningMessages
                value: '{{ join (warningMessages .children.deployment._warnings) ", " }}'

              - path: warningReasons
                value: '{{ join (warningReasons .children.deployment._warnings) ", " }}'

