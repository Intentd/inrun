# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: cronjob-probe
  author: intentd
  version: 0.1.0
  description: >
    CronJobProbe — living integration test for CronJob enrichment notes.
    Creates a CronJob with enrich: [cronjob] so that _lastJob and
    _lastSuccessfulJob are embedded once jobs have run.
    Apply the CR and inspect: kubectl get cronjobprobe <name> -o yaml
    Reuses the NoteProbe CRD.

spec:
  crds:
    cronjob-probe:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      enrich:
        - cronjob
      operatorBox:
        reconcile:
          workers: 1
          resync: 30s

          onCreate:
            cronJobs:
              - name: "{{ .metadata.name }}-cron"
                schedule: "{{ .spec.schedule }}"
                image: "busybox:1.36"
                command:
                  - "sh"
                  - "-c"
                  - "echo Testing... passed"
                reconcile: true
        emit:
          status:
            fields:
              # ── Phase state machine ─────────────────────────────────────────
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    notExists: true

              - path: phase
                value: "Running"
                when:
                  - field: "{{ cronJobActiveCount .children.cronjob }}"
                    greaterThan: "0"

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ jobSucceeded .children.cronjob._lastJob }}"
                    equals: "true"

              - path: phase
                value: "Scheduled"
                when:
                  - field: "{{ cronJobLastScheduleTime .children.cronjob }}"
                    exists: true

              # ── CronJob notes (no enrichment required) ──────────────────────
              - path: activeCount
                value: "{{ cronJobActiveCount .children.cronjob }}"

              - path: lastScheduleTime
                value: "{{ cronJobLastScheduleTime .children.cronjob }}"

              - path: nextScheduleTime
                value: "{{ cronJobNextScheduleTime .children.cronjob }}"

              - path: lastSuccessTime
                value: "{{ cronJobLastSuccessTime .children.cronjob }}"

              # ── enriched CronJob notes (require enrich: [cronjob]) ──────────
              - path: lastJobName
                value: "{{ resourceName .children.cronjob._lastJob }}"

              - path: lastJobSucceeded
                value: "{{ jobSucceeded .children.cronjob._lastJob }}"

              - path: lastSuccessfulJobName
                value: "{{ resourceName .children.cronjob._lastSuccessfulJob }}"

