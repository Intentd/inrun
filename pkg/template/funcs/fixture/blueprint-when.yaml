# yaml-language-server: $schema=https://inrun.dev/schema/v1/blueprint.json
apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: when-probe
  author: intentd
  version: 0.1.0
  description: >
    WhenProbe — integration test for template expressions in when: conditions
    and conditional enrichment.

    Exercises:
      1. Template expressions in when: for resource provisioning — a debug
         Service is only created when spec.debug == "true".
      2. Conditional enrich: — events are only fetched when the deployment
         is not fully ready; replicasets are only fetched when debug mode
         is active. When the deployment is healthy, both are skipped.

    Apply the CR with spec.debug: "false" (default) and verify:
      - No debug Service is created
      - No events or replicasets in .children
    Then patch spec.debug: "true" and verify:
      - Debug Service created
      - events and replicasets appear in .children

spec:
  crds:
    when-probe:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      # ── Conditional enrichment ──────────────────────────────────────────────
      # events: only pay the API cost when the deployment is degraded.
      # replicasets: only visible when debug mode is on.
      enrich:
        - pods
        - events:
            when:
              - field: "{{ replicasReady .children.deployment }}"
                equals: "false"
        - replicasets:
            when:
              - field: spec.debug
                equals: "true"
      operatorBox:
        reconcile:
          workers: 1
          resync: 15s

          onCreate:
            deployments:
              - name: "{{ .metadata.name }}"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas | default \"1\" }}"
                port: "80"
                reconcile: true

            services:
              # Always-on service
              - name: "{{ .metadata.name }}-svc"
                port: "80"
                targetPort: "80"
                reconcile: true

              # Debug service — only created when spec.debug == "true".
              # Template expression in when: field — new in this release.
              - name: "{{ .metadata.name }}-debug"
                port: "9229"
                targetPort: "9229"
                reconcile: true
                when:
                  - field: "{{ .spec.debug }}"
                    equals: "true"
        emit:
          status:
            fields:
              # ── Readiness ────────────────────────────────────────────────────
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    notExists: true

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "true"

              - path: phase
                value: "Degraded"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: "false"

              # ── Pod details ──────────────────────────────────────────────────
              - path: podCount
                value: "{{ podCount .children.deployment._pods }}"

              - path: readyPodCount
                value: "{{ readyPodCount .children.deployment._pods }}"

              - path: hasCrashingPod
                value: "{{ hasCrashingPod .children.deployment._pods }}"

              # ── Conditional fields (only written when debug is on) ───────────
              - path: replicaSetCount
                value: "{{ deploymentReplicaSetCount .children.deployment._replicaSets }}"
                when:
                  - field: spec.debug
                    equals: "true"

              # ── Warning events (only present when degraded) ──────────────────
              - path: hasWarnings
                value: "{{ hasWarnings .children.deployment._warnings }}"
                when:
                  - field: "{{ replicasReady .children.deployment }}"
                    equals: "false"

              - path: firstWarning
                value: "{{ firstWarning .children.deployment._warnings }}"
                when:
                  - field: "{{ hasWarnings .children.deployment._warnings }}"
                    equals: "true"

              # ── Debug gate (template expression in when:) ────────────────────
              - path: debugMode
                value: "active"
                when:
                  - field: "{{ .spec.debug }}"
                    equals: "true"

