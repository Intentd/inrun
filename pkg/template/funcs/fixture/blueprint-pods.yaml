apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: pod-probe
  author: intentd
  version: 0.1.0
  description: >
    PodProbe — living integration test for pod notes.
    Creates a Deployment with enrich: [pods] so that _pods is embedded in
    the resolver context. Status fields exercise every pod note function.
    Apply the CR and inspect: kubectl get podprobe <name> -o yaml
    Reuses the NoteProbe CRD.

spec:
  crds:
    pod-probe:
      crdFile: ./crd.yaml
      crFiles:
        - ./cr.yaml
      enrich: [pods]
      operatorBox:
        reconcile:
          workers: 1
          resync: 30s

          onCreate:
            deployments:
              - name: "{{ .metadata.name }}-app"
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
                reconcile: true
        emit:
          status:
            fields:
              # ── Phase ───────────────────────────────────────────────────────
              - path: phase
                value: "Pending"
                when:
                  - field: status.phase
                    notExists: true

              - path: phase
                value: "Ready"
                when:
                  - field: "{{ allReplicasReady .children.deployment }}"
                    equals: true

              # ── pod notes ───────────────────────────────────────────────────
              - path: podNames
                value: '{{ join (podNames .children.deployment._pods) ", " }}'

              - path: podIPs
                value: '{{ join (podIPs .children.deployment._pods) ", " }}'

              - path: podPhases
                value: '{{ join (podPhases .children.deployment._pods) ", " }}'

              - path: podNodes
                value: '{{ join (podNodes .children.deployment._pods) ", " }}'

              - path: podCount
                value: "{{ podCount .children.deployment._pods }}"

              - path: readyPodCount
                value: "{{ readyPodCount .children.deployment._pods }}"

              - path: podMaxRestarts
                value: "{{ podMaxRestarts .children.deployment._pods }}"

              - path: hasCrashingPod
                value: "{{ hasCrashingPod .children.deployment._pods }}"

              # ── container status notes ──────────────────────────────────────
              - path: podCrashLoopDetected
                value: "{{ podCrashLoopDetected .children.deployment._pods }}"
              - path: podImagePullBackOffDetected
                value: "{{ podImagePullBackOffDetected .children.deployment._pods }}"
              - path: podErrImagePullDetected
                value: "{{ podErrImagePullDetected .children.deployment._pods }}"
              - path: podErrorDetected
                value: "{{ podErrorDetected .children.deployment._pods }}"
              - path: podOOMKilledDetected
                value: "{{ podOOMKilledDetected .children.deployment._pods }}"
              - path: podRunContainerErrorDetected
                value: "{{ podRunContainerErrorDetected .children.deployment._pods }}"
              - path: podCreateContainerErrorDetected
                value: "{{ podCreateContainerErrorDetected .children.deployment._pods }}"
              - path: podInvalidImageNameDetected
                value: "{{ podInvalidImageNameDetected .children.deployment._pods }}"
              - path: podPreStartHookErrorDetected
                value: "{{ podPreStartHookErrorDetected .children.deployment._pods }}"
              - path: podPostStartHookErrorDetected
                value: "{{ podPostStartHookErrorDetected .children.deployment._pods }}"
              - path: podContainerReasons
                value: '{{ join (podContainerReasons .children.deployment._pods) ", " }}'

