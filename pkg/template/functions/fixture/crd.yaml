apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: noteprobes.note.inrun.dev
spec:
  group: note.inrun.dev
  names:
    kind: NoteProbe
    plural: noteprobes
    singular: noteprobe
  scope: Namespaced

  versions:
    - name: v1alpha1
      served: true
      storage: true

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.replicasReady
        - name: Image
          type: string
          jsonPath: .status.containerImage
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                  description: Container image for the probe deployment
                
                replicas:
                  type: integer
                  default: 1
                  description: Number of desired replicas

                minReplicas:
                  type: integer
                  default: 1
                  description: Minimum number of replicas

                maxReplicas:
                  type: integer
                  default: 1
                  description: Maximum number of replicas

                host:
                  type: string
                  default: notes.inrun.dev
                  description: Hostname for the service
                
                debug:
                  type: boolean
                  default: false
                  description: Enable debug mode

                storageClassName:
                  type: string
                  default: standard
                  description: StorageClass to use for PVC provisioning

                storage:
                  type: string
                  default: 10Gi
                  description: Storage size (e.g. 10Gi)

                port:
                  type: integer
                  default: 8080
                  description: Port exposed by the container
                
                resourceProfile:
                  type: string
                  default: burst
                  description: Resource profile to use for HPA

                schedule:
                  type: string
                  description: |
                    Standard cron expression. Examples:
                      "*/5 * * * *"   — every 5 minutes
                      "0 2 * * *"     — daily at 2am
                      "0 0 * * 1"     — every Monday at midnight
                      "@hourly"       — once an hour
                      "@daily"        — once a day
                  default: "@hourly"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
