# yaml-language-server: $schema=https://inrun.dev/schema/v1/include/simulate-ops-rule.json
ops:
  - cycle: 1
    verb: apply
    resource: namespaces
    name: probe-ns
  - cycle: 1
    verb: apply
    resource: configmaps
    name: probe-config
  - cycle: 1
    verb: apply
    resource: secrets
    name: probe-creds
  - cycle: 1
    verb: create
    resource: serviceaccounts
    name: probe-sa
