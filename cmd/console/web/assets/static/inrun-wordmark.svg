<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 48" width="176" height="48" role="img" aria-label="Inrun">
  <title>Inrun</title>
  <style>
    .tile { fill: #4f46e5; }
    .line { fill: none; stroke: #ffffff; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #ffffff; }
    .in   { fill: #4f46e5; }
    .run  { fill: #1e1b4b; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #6366f1; }
      .in   { fill: #818cf8; }
      .run  { fill: #eef2ff; }
    }
  </style>

  <!-- The mark: an inrun (the ramp) that curves into a loop that keeps turning. -->
  <rect class="tile" x="0" y="4" width="40" height="40" rx="10"/>
  <g transform="translate(1.2 5.5)">
    <path class="line" d="M8 7.5 C13 7.5 16 12.5 21 12.5 A8.5 8.5 0 1 1 12.79 18.80"/>
    <path class="head" d="M14.03 14.16 L16.07 19.68 L9.51 17.92 Z"/>
  </g>

  <!-- "in" for intent, "run" for the runner. -->
  <text x="50" y="35" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5"><tspan class="in">in</tspan><tspan class="run">run</tspan></text>
</svg>
