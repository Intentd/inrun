apiVersion: inrun.dev/v1
kind: Blueprint
metadata:
  name: app-platform
  author: intentd
  version: 0.1.0
  tags:
    - apps
    - platform
    - replicaset
    - secrets
    - config
  description: >
    A 5-CRD application platform operator. Manages the full application lifecycle
    using ReplicaSets (not Deployments), auto-rotating API keys, and ConfigMap
    distribution. Imports local modules for structural patterns.

spec:
  crds:
    application:
      namespaced: true
      apiTypes:
        group: apps.demo.inrun.dev
        version: v1alpha1
        kind: Application
        plural: applications
      operatorBox:
        runtime:
          allowedNamespaces:
            - demo-04
        reconcile:
          imports:
            - module: ../modules/replicaset-service/module.yaml
              with:
                image: "{{ .spec.image }}"
                replicas: "{{ .spec.replicas }}"
                port: "{{ .spec.port }}"
            - module: ../modules/rotating-api-key/module.yaml
              with:
                rotateAfter: "90d"
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-config"
                data:
                  LOG_LEVEL: info
                  MAX_CONNECTIONS: "100"
        emit:
          status:
            fields:
              - path: phase
                value: "Ready"

    app-service:
      namespaced: true
      apiTypes:
        group: apps.demo.inrun.dev
        version: v1alpha1
        kind: AppService
        plural: appservices
      operatorBox:
        runtime:
          allowedNamespaces:
            - demo-04
        reconcile:
          onCreate:
            services:
              - name: "{{ .metadata.name }}-svc"
                port: "{{ .spec.port }}"
            configMaps:
              - name: "{{ .metadata.name }}-svc-config"
                data:
                  TIMEOUT: 30s
                  RETRIES: "3"
        emit:
          status:
            fields:
              - path: phase
                value: "Active"
              - path: port
                value: "{{ .spec.port }}"

    route:
      namespaced: true
      apiTypes:
        group: apps.demo.inrun.dev
        version: v1alpha1
        kind: Route
        plural: routes
      operatorBox:
        runtime:
          allowedNamespaces:
            - demo-04
        reconcile:
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-route"
                data:
                  HOST: "{{ .spec.host }}"
                  PATH: "{{ .spec.path }}"
                  SERVICE: "{{ .spec.service }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Bound"
              - path: host
                value: "{{ .spec.host }}"

    config-bundle:
      namespaced: true
      apiTypes:
        group: apps.demo.inrun.dev
        version: v1alpha1
        kind: ConfigBundle
        plural: configbundles
      operatorBox:
        runtime:
          allowedNamespaces:
            - demo-04
        reconcile:
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-bundle"
                data:
                  TARGET: "{{ .spec.target }}"
                  ENV: "{{ .spec.env }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Applied"
              - path: target
                value: "{{ .spec.target }}"

    scale-policy:
      namespaced: true
      apiTypes:
        group: apps.demo.inrun.dev
        version: v1alpha1
        kind: ScalePolicy
        plural: scalepolicies
      operatorBox:
        runtime:
          allowedNamespaces:
            - demo-04
        reconcile:
          onCreate:
            configMaps:
              - name: "{{ .metadata.name }}-scale-policy"
                data:
                  MIN_REPLICAS: "{{ .spec.minReplicas }}"
                  MAX_REPLICAS: "{{ .spec.maxReplicas }}"
                  CPU_THRESHOLD: "{{ .spec.cpuThreshold }}"
        emit:
          status:
            fields:
              - path: phase
                value: "Enforced"
              - path: minReplicas
                value: "{{ .spec.minReplicas }}"
              - path: maxReplicas
                value: "{{ .spec.maxReplicas }}"
