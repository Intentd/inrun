# yaml-language-server: $schema=https://inrun.dev/schema/v1/module.json
apiVersion: inrun.dev/v1
kind: Module
metadata:
  name: worker-pool
  version: v0.1.0
  description: >
    A pool of identical worker pods managed as a ReplicaSet.
    No Service — workers pull work, they don't accept connections.
  author: intentd
  tags:
    - replicaset
    - workers
    - batch
    - processing

inputs:
  - name: image
    required: true
    description: Worker container image

  - name: workers
    default: "2"
    description: Number of worker replicas

resources:
  replicaSets:
    - name: "{{ .metadata.name }}-worker"
      image: '{{ index .inputs "image" }}'
      replicas: '{{ index .inputs "workers" }}'

status:
  fields:
    - path: workers
      value: '{{ index .inputs "workers" }}'
