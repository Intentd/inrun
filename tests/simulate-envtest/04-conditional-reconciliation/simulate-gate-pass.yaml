apiVersion: inrun.dev/v1
kind: Simulate
metadata:
  name: gate-pass
  description: >
    spec.enabled: true — gate passes, reconciler runs, Deployment applied in cycle 1.

spec:
  blueprint: ./blueprint.yaml
  crd: ./crd.yaml
  cr: ./cr-enabled.yaml
  cycles: 5

  expect:
    steady: true
    noErrors: true
    ops:
      - cycle: 1
        verb: apply
        resource: deployments
        name: test-probe
